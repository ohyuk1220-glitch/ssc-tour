<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="과학관 탐방">
<meta name="theme-color" content="#0d0b08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="character/down.png">
<title>과학관 탐방</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font-sans:"Pretendard",-apple-system,sans-serif;
    --font-num:"Baloo 2",var(--font-sans);
    --ink:#2a2620; --panel:#fffdf7; --line:#e6dcc8;
    --g:#4caf50; --o:#ef8c3b; --b:#4a90e2; --y:#f4c430;
    --gold:#f6b93b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;
    background:#0d0b08;font-family:var(--font-sans);color:var(--ink);
    user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #cv{position:fixed;inset:0;width:100vw;height:100vh}   /* 게임 캔버스 전용 — 전역 canvas에 fixed를 걸면 미니맵 등 다른 캔버스가 오염됨 (P3에서 실측) */

  /* ---- 세로 회전 안내 ---- */
  #rotate{position:fixed;inset:0;z-index:200;background:#0d0b08;color:#fff;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px}
  #rotate .ph{font-size:64px;animation:tilt 1.4s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(78deg)}}
  #rotate p{font-size:17px;line-height:1.6;opacity:.9}
  /* 세로도 플레이 허용 — 회전 강제 안내 끔 */

  /* ---- HUD ---- */
  .hud{position:fixed;z-index:40;pointer-events:none}
  #hud-top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px}
  .badge{pointer-events:auto;background:var(--panel);border:2px solid var(--ink);
    border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:7px;
    box-shadow:0 3px 0 rgba(0,0,0,.25);font-weight:800}
  .badge .n{font-family:var(--font-num);font-size:19px;color:var(--o)}
  .badge .t{font-family:var(--font-num);font-size:19px;color:#b8ad97}
  .level-badge{padding-left:9px;padding-right:9px}
  .level-badge .n{color:#287a2e}
  .level-name{font-size:12px;color:#6e6657;white-space:nowrap}
  .topbtns{display:flex;gap:8px}
  .iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:12px;border:2px solid var(--ink);
    background:var(--panel);font-size:20px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
  .iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  #floortag{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:40;
    background:rgba(20,16,10,.82);color:#fff;padding:5px 16px;border-radius:20px;
    font-weight:800;font-size:14px;letter-spacing:.3px;white-space:nowrap;
    border:1.5px solid rgba(255,255,255,.25)}
  #floortag .rm{color:var(--gold);margin-left:6px}

  /* ---- 조이스틱 ---- */
  #stick{position:fixed;left:22px;bottom:26px;width:120px;height:120px;z-index:45;
    border-radius:50%;background:rgba(255,253,247,.14);border:2.5px solid rgba(255,255,255,.4);
    touch-action:none}
  #stick .nub{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(255,253,247,.9);border:2.5px solid var(--ink);
    box-shadow:0 2px 0 rgba(0,0,0,.3)}

  /* ---- A 버튼 ---- */
  #abtn{position:fixed;right:26px;bottom:34px;width:96px;height:96px;z-index:45;
    border-radius:50%;border:3px solid var(--ink);background:#c9c2b0;color:#7a7360;
    font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer;transition:transform .05s;opacity:.55}
  #abtn.on{background:var(--gold);color:#3a2c00;opacity:1;animation:apulse 1s ease-in-out infinite}
  #abtn.on:active{transform:translateY(3px)}
  #abtn .ai{font-size:30px;line-height:1}
  @keyframes apulse{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.3)}50%{box-shadow:0 4px 0 rgba(0,0,0,.3),0 0 16px var(--gold)}}

  /* ---- 토스트 ---- */
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);
    z-index:80;background:rgba(20,16,10,.94);color:#fff;padding:11px 20px;border-radius:14px;
    font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center;
    border:1.5px solid rgba(255,255,255,.2)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- 모달 ---- */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(10,8,5,.72);
    display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
  .modal.show{display:flex}
  .sheet{background:var(--panel);border:2.5px solid var(--ink);border-radius:20px;
    width:min(460px,94vw);max-height:88vh;overflow-y:auto;box-shadow:0 10px 0 rgba(0,0,0,.25);padding:22px}
  .sheet h2{font-size:20px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .sheet .sub{font-size:13px;color:#8a8069;margin-bottom:16px}
  .xbtn{float:right;width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);
    background:#fff;font-size:17px;cursor:pointer;margin:-4px -4px 0 0}
  .map-floor{margin-bottom:12px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .map-floor h3{font-size:14px;font-weight:800;padding:8px 12px;background:#f3ecdb;
    display:flex;justify-content:space-between}
  .map-floor h3 .cur{color:var(--o);font-size:12px}
  .rooms{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
  .room-chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;
    border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;gap:5px}
  .room-chip.done{background:#fff7e6;border-color:var(--gold);color:#8a6d00}
  .room-chip.scanned{background:#eefbf0;border-color:#4caf50;color:#287a2e}
  .room-chip.soon{opacity:.5}
  /* 수료증 */
  #cert .sheet{text-align:center;background:linear-gradient(160deg,#fffdf7,#fff4dd)}
  .cert-seal{font-size:60px;margin:6px 0}
  .cert-title{font-family:var(--font-num);font-size:26px;font-weight:800;color:var(--o)}
  .cert-count{font-family:var(--font-num);font-size:15px;color:#8a8069;margin:8px 0 16px}
  .cert-stars{font-size:20px;letter-spacing:3px;margin-bottom:6px}
  .btn-primary{margin-top:16px;width:100%;padding:13px;border-radius:13px;border:2.5px solid var(--ink);
    background:var(--gold);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  /* 축하 */
  #cheer .sheet{text-align:center;animation:pop .35s cubic-bezier(.2,1.3,.5,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .cheer-icon{font-size:66px;margin:4px 0}
  .cheer-h{font-size:22px;font-weight:800;color:var(--o)}
  .cheer-room{font-size:13px;color:#8a8069;margin-top:4px}
  #scanCheer .sheet{text-align:center;background:linear-gradient(155deg,#fffdf7,#e9ffe9);
    border-color:#287a2e;box-shadow:0 12px 0 rgba(0,0,0,.28),0 0 36px rgba(76,175,80,.45);
    animation:scanPop .5s cubic-bezier(.12,1.35,.35,1)}
  @keyframes scanPop{from{transform:scale(.55) rotate(-3deg);opacity:0}to{transform:scale(1);opacity:1}}
  .scan-icon{font-size:82px;line-height:1.1;margin:2px 0 6px;animation:scanGlow 1s ease-in-out infinite alternate}
  @keyframes scanGlow{from{filter:drop-shadow(0 0 2px #f6b93b);transform:scale(1)}to{filter:drop-shadow(0 0 14px #4caf50);transform:scale(1.08)}}
  .scan-title{font-size:25px;font-weight:800;color:#287a2e}
  .scan-name{font-size:18px;font-weight:800;margin:8px 0 4px}
  .scan-msg{font-size:15px;color:#5a5344}
  .scan-points{font-family:var(--font-num);font-size:26px;font-weight:800;color:#e58e26;margin-top:10px}

  /* 로딩 */
  #boot{position:fixed;inset:0;z-index:150;background:#12100c;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  #boot .bi{font-size:52px}
  #boot .bt{font-weight:800;font-size:17px}
  #boot .bp{font-size:13px;opacity:.6}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="rotate"><div class="ph">📱</div><p><b>휴대폰을 가로로 돌려주세요</b><br>과학관 탐방은 가로 화면에서 즐길 수 있어요</p></div>

<div class="hud" id="hud-top">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div class="badge" id="badge">🎫 <span class="n" id="sc">0</span><span class="t">/7</span></div>
    <div class="badge">⭐ <span class="n" id="scoreVal">0</span><span class="t">점</span></div>
    <div class="badge level-badge"><span class="n" id="levelVal">Lv1</span><span class="level-name" id="levelName">방문객</span></div>
  </div>
  <div class="topbtns">
    <div class="iconbtn" id="soundBtn">🔊</div>
    <div class="iconbtn" id="mapBtn">📖</div>
    <div class="iconbtn" id="certBtn">🏆</div>
  </div>
</div>
<div id="floortag">1층<span class="rm">로비</span></div>

<div id="stick"><div class="nub" id="nub"></div></div>
<div id="abtn"><span class="ai">🚪</span><span id="alabel">입장</span></div>

<div id="toast"></div>

<!-- 지도 -->
<div class="modal" id="map"><div class="sheet">
  <button class="xbtn" data-close>✕</button>
  <h2>🗺️ 나의 탐험 지도</h2>
  <div class="sub">전시실을 방문해 미니게임 스탬프를 모으세요</div>
  <div id="mapBody"></div>
</div></div>

<!-- 수료증 -->
<div class="modal" id="cert"><div class="sheet">
  <button class="xbtn" data-close>✕</button>
  <div class="cert-seal">🏅</div>
  <div class="cert-title">과학관 탐방 수료증</div>
  <div class="cert-stars" id="certStars"></div>
  <div class="cert-count" id="certCount"></div>
  <div id="certMsg" style="font-size:14px;line-height:1.6;color:#5a5344"></div>
  <button class="btn-primary" data-close>계속 탐험하기</button>
</div></div>

<!-- 축하 -->
<div class="modal" id="cheer"><div class="sheet">
  <div class="cheer-icon" id="cheerIcon">🎉</div>
  <div class="cheer-h">스탬프 획득!</div>
  <div class="cheer-room" id="cheerRoom"></div>
  <button class="btn-primary" id="cheerNext">좋아요!</button>
</div></div>

<!-- 현장 QR 인증 -->
<div class="modal" id="scanCheer"><div class="sheet">
  <div class="scan-icon" id="scanIcon">📍</div>
  <div class="scan-title">현장 인증 완료!</div>
  <div class="scan-name" id="scanName"></div>
  <div class="scan-msg">현장에서 직접 확인하셨네요!</div>
  <div class="scan-points" id="scanPoints"></div>
  <button class="btn-primary" data-close>인증 완료</button>
</div></div>

<!-- 전시물 관람 -->
<div class="modal" id="exhibit"><div class="sheet" style="text-align:center">
  <button class="xbtn" data-close style="float:right">✕</button>
  <div id="exhibitIcon" style="font-size:56px;margin:8px 0 2px"></div>
  <h2 id="exhibitName" style="justify-content:center;display:block;margin-bottom:10px"></h2>
  <p id="exhibitInfo" style="font-size:15px;line-height:1.75;color:#5a5344;text-align:left"></p>
  <button class="btn-primary" data-close>닫기</button>
</div></div>

<!-- 홈 화면 추가(전체화면) 자동 안내 -->
<div id="a2hs" style="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:120;
  background:rgba(20,16,10,.96);color:#fff;padding:11px 15px;border-radius:14px;display:none;
  align-items:center;gap:11px;font-size:13px;font-weight:700;max-width:92vw;border:1.5px solid #f6b93b;box-shadow:0 4px 16px rgba(0,0,0,.4)">
  <span id="a2hsMsg"></span>
  <button id="a2hsBtn" style="background:#f6b93b;color:#3a2c00;border:none;border-radius:9px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer">설치</button>
  <span id="a2hsX" style="cursor:pointer;opacity:.6;font-size:16px">✕</span>
</div>

<div id="boot"><div class="bi">🔬</div><div class="bt">과학관 탐방</div><div class="bp">불러오는 중…</div></div>

<script>
"use strict";
const HUB_VERSION="5.0-pixel-bg";

/* ══════════ 데이터: 8층 · 전시실 핫스팟 ══════════
   x,y = 배경 이미지 안에서의 비율좌표(0~1). kind: game|soon|elevator
   game은 file+best(localStorage 키)로 스탬프 판정 */
const FLOORS=[
 {id:"B1", name:"지하주차장", bg:"bg/f_b1_hq.png", tint:"#3a3f4a", start:[0.5,0.58],
   obstacles:[[0.28,0.30,0.33,0.37],[0.20,0.45,0.25,0.52],[0.31,0.56,0.36,0.63],[0.38,0.20,0.43,0.27],[0.58,0.28,0.63,0.35],[0.70,0.33,0.75,0.40],[0.59,0.56,0.64,0.63],[0.50,0.68,0.55,0.75],[0.72,0.53,0.77,0.60],[0.69,0.66,0.74,0.73],[0.43,0.30,0.54,0.40]], spots:[
   {name:"수상한 상자", room:"B1 주차장", kind:"soon", icon:"📦", x:0.10,y:0.62, color:"#8a7a5a"},
   {name:"메인 엘리베이터", kind:"elevator", elev:"A", floors:["PI","2F","1F","B1"], icon:"🛗", x:0.48,y:0.42, color:"#9aa"},
 ]},
 {id:"1F", name:"1층 로비 · 중앙", bg:"bg/lobby_center.webp", tint:"#4caf50", start:[0.458,0.70],
   // 2026-07-28 P1 아이소(2024 1층A) 정합 재생성: 토러스=보이드 상공, 정문=남측 방풍실, √2계단=북동(개방 채널+zones)
   obstacles:[[0.00,0.00,1.00,0.07],   // 상단 벽·천창부
     [0.16,0.12,0.36,0.45],[0.36,0.12,0.55,0.45],   // 선큰 보이드 난간(2분할 — §2-2 단일 rect 10% 상한)
     [0.00,0.16,0.16,0.38],            // 빨간 전시월·안내판
     [0.10,0.42,0.20,0.55],            // 계산기 사물함
     [0.55,0.10,0.578,0.30],           // √2계단 좌측 난간(보이드와 계단 채널 분리)
     [0.72,0.00,0.86,0.16],            // 계단 우측 상부 벽
     [0.86,0.06,1.00,0.46],            // 동측 벽·부속실 (하단 0.46 — 동측 회랑 진입폭 0.06 확보)
     [0.75,0.52,0.88,0.78],            // 메인 엘리베이터 샤프트
     [0.82,0.72,0.98,0.87],            // 쇼파 알코브
     [0.375,0.70,0.425,0.93],[0.49,0.70,0.545,0.93],   // 정문 방풍실 좌·우벽
     [0.40,0.46,0.585,0.63],           // 곡선 벤치 클러스터
     [0.03,0.50,0.08,0.56],[0.13,0.63,0.175,0.71],[0.70,0.53,0.745,0.60]], // 기둥 3 (계단 채널 안 유령 기둥 제거 — codex R1)
   walkable:[0.03,0.08,0.97,0.90],
   zones:[{to:"SQRT2",rect:[0.655,0.00,0.735,0.11]}],   // 개방 계단 채널(x0.578~0.72) 꼭대기 도달 시 자동 √2층
   spots:[
   {name:"← 서쪽 로비", kind:"gate", to:"LOBBY_W", icon:"⬅️", label:"서쪽", x:0.03,y:0.60, color:"#4caf50"},
   {name:"동쪽 로비 →", kind:"gate", to:"LOBBY_E", icon:"➡️", label:"동쪽", x:0.965,y:0.62, color:"#4a90e2"},
   {name:"정문으로 나가기", kind:"gate", to:"OUTSIDE", icon:"🚪", label:"정문", x:0.458,y:0.80, color:"#9aa"},
   {name:"계산기 사물함", kind:"info", icon:"🧮", x:0.235,y:0.50, color:"#78909c",
    info:"로커 문이 계산기 숫자키 모양으로 꾸며진 물품보관함이에요."},
   {name:"메인 엘리베이터", kind:"elevator", elev:"A", floors:["PI","2F","1F","B1"], icon:"🛗", x:0.72,y:0.72, color:"#9aa"},
   {name:"↑ √2층 계단", kind:"stair", to:"SQRT2", icon:"🪜", x:0.59,y:0.335, color:"#b0a99a"}, // 표지판은 계단 초입에 (걸어 올라가도 되고 A눌러도 됨)
   {name:"뒤틀림-토러스", kind:"exhibit", qid:"e-torus", khash:"a2fcc510479e69a0e9a90158221d500946ed933b7c0e9d3993be42665d7b7a0b", icon:"✨", x:0.36,y:0.485, color:"#f6b93b",
    info:"위상수학의 기본 개념으로 우주 공간의 모습을 형상화한 작품이에요. 안과 밖이 엇갈린 그물망은 뫼비우스의 띠처럼 상호순환하고, 얇은 구리선의 연결은 피보나치 수열을 재해석한 토러스 구조랍니다. 구리선·기판과 LED 전구 5,000개 이상으로 만든 15,600 × 9,600 × 4,900mm 크기의 작품으로, 김주현과 Our Labour가 2016년에 제작했어요. 주변 꽃잎은 대개 3·5·8장이고 솔방울 나선은 시계방향 8줄·반시계방향 13줄인 것처럼, 자연에서도 피보나치 수를 찾아볼 수 있어요."},
   {name:"휴게 쇼파", kind:"info", icon:"🛋️", x:0.49,y:0.655, color:"#607d8b",

  if(!r.obstacles) r.obstacles=[[0.10,0.13,0.44,0.50],[0.56,0.13,0.94,0.50]];   // 전시물 좌·우
  if(!r.walkable) r.walkable=[0.05,0.13,0.95,0.93];
});
FLOORS.forEach(f=>{ if(!f.walkable) f.walkable=(f.bg&&f.bg.includes('_town'))?[0.06,0.40,0.94,0.90]:[0.03,0.05,0.97,0.95]; }); // town=바닥광장만 걷기(벽 위 방지)

/* 스탬프 = 모든 game 핫스팟(층 오버월드 + 실내 방) */
const STAMPS=[];
function _pushGames(scene, floorName){ scene.spots.forEach(s=>{ if(s.kind==="game") STAMPS.push({
  id:s.best, floor:floorName, room:s.room, label:s.label, icon:s.icon, key:s.best}); }); }
FLOORS.forEach(f=>_pushGames(f, f.name));
Object.values(ROOMS).forEach(r=>_pushGames(r, r.floorName));
const STAMP_TOTAL=STAMPS.length;

/* ══════════ localStorage 안전 래퍼 (차단/프라이빗 모드 대비) ══════════ */
function safeGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function safeSet(k,v){
  try{ const stored=String(v); localStorage.setItem(k,stored); return localStorage.getItem(k)===stored; }
  catch(e){ return false; }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// 장애물(전시물·벽) 충돌: 점(px,py)이 어떤 obstacle rect 안이면 true
function hitObs(obs,px,py){ if(!obs)return false; for(let i=0;i<obs.length;i++){const o=obs[i];
  if(px>o[0]&&px<o[2]&&py>o[1]&&py<o[3])return true;} return false; }

function updateNPCPatrol(npc){
  if(npc._pause>0){ npc._pause--; npc.vx=npc.vy=0; return; }
  const fl=FLOORS.find(f=>f.id===npc.scene);
  const wa=(fl&&fl.walkable)||[0.12,0.4,0.88,0.88];
  // 랜덤 목표점(walkable 안)으로 돌아다님 — 도달하면 잠깐 멈췄다 새 목표
  // 목표는 장애물 밖에서만 채택 (2026-07-26: 장애물 많은 로비에서 제자리걸음하던 문제)
  if(!npc._tgt){
    for(let k=0;k<12;k++){
      const cand=[wa[0]+Math.random()*(wa[2]-wa[0]), wa[1]+Math.random()*(wa[3]-wa[1])];
      if(!hitObs(fl&&fl.obstacles,cand[0],cand[1])){ npc._tgt=cand; break; }
    }
    if(!npc._tgt) return; // 이번 프레임은 대기, 다음 프레임 재시도
  }
  const dx=npc._tgt[0]-npc.x, dy=npc._tgt[1]-npc.y, d=Math.hypot(dx,dy);
  const SPD=0.0009;
  if(d<0.02){ npc._tgt=null; npc._pause=40+Math.floor(Math.random()*70); npc.vx=npc.vy=0; return; }
  const vx=dx/d*SPD, vy=dy/d*SPD;
  const obs=fl&&fl.obstacles;
  const nx=npc.x+vx; if(!hitObs(obs,nx,npc.y)) npc.x=nx; else { npc._tgt=null; }  // 막히면 새 목표
  const ny=npc.y+vy; if(!hitObs(obs,npc.x,ny)) npc.y=ny; else { npc._tgt=null; }
  npc.vx=vx; npc.vy=vy;
  if(Math.abs(vx)>Math.abs(vy)) npc.dir=vx>0?"right":"left"; else if(vy!==0) npc.dir=vy>0?"down":"up";
  npc.x=clamp(npc.x,wa[0],wa[2]); npc.y=clamp(npc.y,wa[1],wa[3]);
}
function updateNPCs(){ SECURITY_NPCS.forEach(updateNPCPatrol); CLEANING_NPCS.forEach(updateNPCPatrol); }

function sfx(freq,dur,type,vol){
  if(!sndOn)return;
  try{ if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=_ac.createOscillator(),g=_ac.createGain();
    o.type=type||"square"; o.frequency.value=freq; o.connect(g); g.connect(_ac.destination);
    const v=(vol==null?0.14:vol); g.gain.setValueAtTime(v,_ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,_ac.currentTime+(dur||0.09));
    o.start(); o.stop(_ac.currentTime+(dur||0.09));
  }catch(e){}
}

function updateParts(){ for(let i=parts.length-1;i>=0;i--){const p=parts[i];
  p.x+=p.vx; p.y+=p.vy; p.vy+=0.16; p.life-=0.022; if(p.life<=0)parts.splice(i,1);}}

  ctx.fillRect((p.x-2)|0,(p.y-2)|0,4,4);}); ctx.globalAlpha=1; }

function roomLeadsTo(startId,targetId,seen){
  if(startId===targetId)return true;
  if(seen.has(startId)||!ROOMS[startId])return false;
  seen.add(startId);
  return ROOMS[startId].spots.some(s=>s.kind==="door"&&ROOMS[s.room]&&roomLeadsTo(s.room,targetId,seen));
}
function roomFloorIndex(roomId){
  return FLOORS.findIndex(f=>f.spots.some(s=>s.kind==="door"&&ROOMS[s.room]&&roomLeadsTo(s.room,roomId,new Set())));
}

  enterRoom(roomId);
}

function enterFloor(idx,instant){

}
function enterRoom(roomId, fromStack){
  if(inRoom && !fromStack) roomStack.push(inRoom);   // 방→방 진입이면 이전 방 저장
  inRoom=roomId; shake=7; const r=ROOMS[roomId];

/* 전시실에서 나올 때 문 앞 좌표가 장애물 안이면 캐릭터가 영구히 갇힌다(모든 축 이동이 hitObs에 거부됨).
   → 목표 지점이 막혀 있으면 주변을 나선형으로 훑어 walkable하고 장애물 아닌 첫 지점을 찾는다.
   배경·장애물이 바뀌어도 안 터지게 좌표 하드코딩 대신 탐색으로 처리. */
function safeSpawn(f,x,y){
  const obs=f.obstacles, wk=f.walkable;
  const okAt=(px,py)=>{
    if(hitObs(obs,px,py)) return false;
    if(wk && (px<wk[0]||px>wk[2]||py<wk[1]||py>wk[3])) return false;
    return px>=0.02&&px<=0.98&&py>=0.02&&py<=0.98;
  };
  if(okAt(x,y)) return [x,y];
  for(let r=0.03;r<=0.45;r+=0.03){                     // 반경을 넓혀가며 8방향 탐색
    for(let a=0;a<16;a++){
      const t=a*Math.PI/8, px=x+Math.cos(t)*r, py=y+Math.sin(t)*r*0.7;   // 아이소 화면이라 세로는 눌러서
      if(okAt(px,py)) return [px,py];
    }
  }
  const st=f.start||[0.5,0.5]; return [st[0],st[1]];   // 최후 폴백: 씬 시작 지점
}
function exitRoom(){
  if(roomStack.length){ enterRoom(roomStack.pop(), true); return; }   // 이전 방(예: 지진→G전시실)으로 복귀
  const back=inRoom; inRoom=null;
  const f=curScene();
  curImg=(f._ok?images[f.id]:null);
  const d=(lastFloorDoor&&lastFloorDoor.room===back)?lastFloorDoor
        :f.spots.find(s=>s.kind==="door"&&s.room===back);   // 들어온 문 기억 우선(문 2개 방 대응), 딥링크 등 기억 없으면 첫 문
  if(d){ const sp=safeSpawn(f,d.x,Math.min(0.9,d.y+0.08)); player.px=sp[0]; player.py=sp[1]; }
  else { const st=f.start||[0.5,0.5]; player.px=st[0]; player.py=st[1]; }
  player.vx=player.vy=0; camX=player.px; camY=player.py; nearSpot=null; nearNPC=null; updateFloorTag();
}
function updateFloorTag(){
  const s=curScene();
  document.getElementById("floortag").innerHTML=s.name+'<span class="rm">'+
    (nearNPC?nearNPC.name:(nearSpot?nearSpot.name:(inRoom?"전시실 관람":"둘러보기")))+'</span>';
}

/* ══════════ 렌더 ══════════ */
const CAM_ZOOM=1.05, CAM_ZOOM_ROOM=1.15;   // 컨셉처럼 한 층 전체가 한 화면에(줌아웃=공간감). 실내는 방이 작아 살짝 더 확대
function computeBgRect(){
  // 배경을 화면보다 크게(cover×zoom) 그리고 카메라가 캐릭터를 따라감 → 스크롤 탐험
  const iw=(curImg&&curImg.naturalWidth)||1381, ih=(curImg&&curImg.naturalHeight)||1139;
  const scale=Math.max(W/iw, H/ih)*(inRoom?CAM_ZOOM_ROOM:CAM_ZOOM);
  const w=iw*scale, h=ih*scale;
  // 카메라(부드럽게 따라오는 camX,camY)가 화면 중앙에 오도록 배경을 반대로 이동
  let x=W/2-camX*w, y=H/2-camY*h;
  // 맵 끝에서는 카메라 clamp(검은 여백 최소화). w>W, h>H 이므로 [W-w,0] 범위
  x=clamp(x, W-w, 0);
  y=clamp(y, H-h, 0);
  bgRect={x:x+shX, y:y+shY, w, h};
}
function s2x(px){return bgRect.x+px*bgRect.w;}
function s2y(py){return bgRect.y+py*bgRect.h;}

let t=0;
function render(){
  if(document.hidden){return;}   // 숨김 탭만 스킵(세로에서도 화면 꽉 렌더)
  t++;
  computeBgRect();
  const f=curScene();
  // 배경
  ctx.fillStyle="#0d0b08"; ctx.fillRect(0,0,W,H);
  if(curImg){
    ctx.drawImage(curImg,bgRect.x,bgRect.y,bgRect.w,bgRect.h);
  }else{
    // placeholder (배경 아직 없음)
    ctx.fillStyle=f.tint+"22"; ctx.fillRect(bgRect.x,bgRect.y,bgRect.w,bgRect.h);
    ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.font="800 20px var(--font-sans)";
    ctx.fillText(f.name+" 준비 중",W/2,H/2);
  }
  // 핫스팟 마커 — 바닥 원 제거(배경 오염 방지), 아이콘 말풍선이 표지판 역할.
  // 근접 표시 = 말풍선 확대 + 통통 튀기 + 테두리 색 강조 (2026-07-26 마스터 지적: 발밑 타원 겹침 정리)
  f.spots.forEach(sp=>{
    const x=s2x(sp.x), y=s2y(sp.y);
    const done=(sp.kind==="game"&&isDone(sp.best));
    const isNear=(sp===nearSpot);
    const s=isNear?1.28:1;
    const hop=isNear?Math.abs(Math.sin(t*0.12))*5:0;
    const edge=done?"#f6b93b":(isNear?(sp.color||"#f6b93b"):"#2a2620"); // 완료 금색이 근접 강조보다 우선
    // 아이콘 버블
    const by=y-30+Math.sin(t*0.06)*3-hop;
    roundRect(x-18*s,by-18*s,36*s,34*s,9*s);
    ctx.fillStyle=done?"#fff7e6":"#fffdf7"; ctx.fill();
    ctx.lineWidth=isNear?3.5:2.5; ctx.strokeStyle=edge; ctx.stroke();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=Math.round(19*s)+"px var(--font-sans)"; ctx.fillText(sp.icon,x,by-2*s);
    // 상태 배지
    if(sp.kind==="game"){
      ctx.font="800 "+Math.round(11*s)+"px var(--font-sans)";
      ctx.fillStyle=done?"#c9930a":"#2a2620";
      ctx.fillText(done?"⭐":"▶",x+13*s,by-24*s);
    }
    // 삼각 꼬리
    ctx.beginPath(); ctx.moveTo(x-5*s,by+15*s);ctx.lineTo(x+5*s,by+15*s);ctx.lineTo(x,by+21*s);ctx.closePath();
    ctx.fillStyle=done?"#fff7e6":"#fffdf7"; ctx.fill(); ctx.strokeStyle=edge;ctx.stroke();
  });
  // NPC(안내·보안)
  sceneNPCs().forEach(drawNPC);
  // 캐릭터
  drawPlayer(s2x(player.px), s2y(player.py));
  // 파티클 (juice)
  drawParts();
  drawPops();
  // 페이드
  if(fadeAlpha>0){ ctx.fillStyle="rgba(10,8,5,"+fadeAlpha+")"; ctx.fillRect(0,0,W,H); }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawPlayer(x,y){
  const moving=(Math.abs(player.vx)+Math.abs(player.vy))>0.0005;
  const ph=t*0.16;                                     // 걸음 위상 (자연스러운 보행: ~1.5Hz)
  const bob=moving?Math.abs(Math.sin(ph))*5:0;         // 상하 통통(발 구름)
  const tilt=moving?Math.sin(ph*0.5)*0.07:0;           // 좌우 갸웃(리듬)
  const sq=moving?1+Math.sin(ph)*0.06:1;               // 착지 스쿼시(세로)
  let spr=CHAR[player.dir||"down"];
  // 이동 중이면 걷기 프레임(반대발)과 토글 → 다리 교차 애니
  if(moving){ const ws=CHARWALK[player.dir||"down"]; if(ws&&ws.complete&&ws.naturalWidth&&Math.floor(t/12)%2===1) spr=ws; }
  // 그림자(발 뗄수록 작아짐 → 뜬 느낌)
  const shs=1-bob*0.03;
  ctx.beginPath();ctx.ellipse(x,y+16,18*shs,7*shs,0,0,7);ctx.fillStyle="rgba(0,0,0,.3)";ctx.fill();
  if(spr&&spr.complete&&spr.naturalHeight){
    const h=40, w=spr.naturalWidth*h/spr.naturalHeight;   // 화면 표시 높이(작을수록 공간 넓게)
    ctx.save();
    ctx.translate(x, y+12);
    ctx.rotate(tilt);
    ctx.drawImage(spr, Math.round(-w/2), Math.round(-h-bob), Math.round(w), Math.round(h*sq));
    ctx.restore();
  }
}
/* ── 경비원 캔버스 직접 드로잉 (제복+모자+배지) ── */
function drawSecurityNPC(x, y, bob){
  const by=Math.round(y+12-bob);
  ctx.fillStyle="#1a2d1a"; ctx.fillRect(Math.round(x-6),by-8,5,10); ctx.fillRect(Math.round(x+1),by-8,5,10);
  ctx.fillStyle="#253b25"; roundRect(x-10,by-28,20,22,4); ctx.fill();
  ctx.fillStyle="#d4a017"; roundRect(x-4,by-24,8,5,2); ctx.fill();
  ctx.fillStyle="#f6d45a"; ctx.font="bold 5px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("★",x,by-22);
  ctx.fillStyle="#1a4a1a"; ctx.fillRect(Math.round(x-11),by-27,4,5); ctx.fillRect(Math.round(x+7),by-27,4,5);
  ctx.fillStyle="#c8916a"; ctx.fillRect(Math.round(x-3),by-31,6,5);
  ctx.fillStyle="#d9a07a"; ctx.beginPath();ctx.ellipse(x,by-37,7,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#2a1800"; ctx.beginPath();ctx.arc(x-3,by-38,1.5,0,Math.PI*2);ctx.fill(); ctx.beginPath();ctx.arc(x+3,by-38,1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#1a2040"; ctx.beginPath();ctx.ellipse(x,by-44,9,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#232a55"; roundRect(x-7,by-52,14,11,3); ctx.fill();
  ctx.fillStyle="#d4a017"; ctx.fillRect(Math.round(x-7),by-44,14,2);
}
/* ── NPC 렌더(플레이어 스프라이트 재활용 + 색 틴트) ── */
const _npcTintCache={};
function tintedSprite(img,tint){
  if(!img||!img.complete||!img.naturalWidth) return null;
  const key=tint+"|"+img.src;
  if(_npcTintCache[key]) return _npcTintCache[key];
  const oc=document.createElement("canvas");
  oc.width=img.naturalWidth; oc.height=img.naturalHeight;
  const octx=oc.getContext("2d");
  octx.drawImage(img,0,0);
  octx.globalCompositeOperation="source-atop";
  octx.fillStyle=tint; octx.globalAlpha=0.5;
  octx.fillRect(0,0,oc.width,oc.height);
  octx.globalAlpha=1; octx.globalCompositeOperation="source-over";
  _npcTintCache[key]=oc;
  return oc;
}
function drawNPC(npc){
  const x=s2x(npc.x), y=s2y(npc.y);
  const seed=npc._seed||(npc._seed=Math.random()*10);
  const moving=npc.type!=="guide"&&((Math.abs(npc.vx||0)+Math.abs(npc.vy||0))>0.00005);
  const bob=npc.type!=="guide"
    ? (moving?Math.abs(Math.sin(t*0.30+seed))*4:0)
    : Math.abs(Math.sin(t*0.03+seed))*1.5;   // 안내 NPC = 잔잔한 숨쉬기 bob
  ctx.beginPath();ctx.ellipse(x,y+16,17,7,0,0,7);ctx.fillStyle="rgba(0,0,0,.28)";ctx.fill();
  const ownName = npc.type==="guide" ? GUIDE_SPR[npc.scene] : npc._spr;
  const own = ownName ? NPCSPR[ownName] : null;
  if(own && own.complete && own.naturalWidth){
    // 전용 스프라이트(색 틴트·이모지 없음) — 과학커뮤니케이터·보안 공통
    const h=44, w=own.naturalWidth*h/own.naturalHeight;
    ctx.drawImage(own, Math.round(x-w/2), Math.round(y+12-h-bob), Math.round(w), Math.round(h));
    // 데스크 스프라이트 제거(2026-07-14): 새 로비 배경에 안내데스크가 이미 그려져 있어 중복 — NPC만 카운터 뒤에 배치
  }else if(npc.type==="security"){
    // 폴백: 보안 스프라이트 로드 실패 시에만 캔버스 드로잉
    drawSecurityNPC(x, y, bob);
  }else{
    // 폴백: 전용 스프라이트 로드 실패 시 틴트 + 타입별 아이콘 (안내=파랑🧑‍🏫 / 미화=청록🧹)
    const tint=npc.type==="cleaning"?"#2a8f8f":"#3a6fd8";
    const spr=CHAR[npc.dir||"down"];
    const timg=tintedSprite(spr,tint);
    if(timg&&timg.width){
      const h=38, w=timg.width*h/timg.height;
      ctx.drawImage(timg, Math.round(x-w/2), Math.round(y+12-h-bob), Math.round(w), Math.round(h));
    }else{
      ctx.beginPath(); ctx.arc(x,y-10-bob,14,0,7); ctx.fillStyle=tint; ctx.fill();
    }
    ctx.font="15px var(--font-sans)"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(npc.type==="cleaning"?"🧹":"🧑‍🏫", x, y-40-bob);
  }
  if(npc===nearNPC){
    // 근접 표시: 발밑 링 대신 머리 위 말풍선 (발밑 그림자·타원 겹침 정리, 2026-07-26)
    const hop=Math.abs(Math.sin(t*0.12))*4;
    ctx.font="17px var(--font-sans)"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("💬", x, y-46-bob-hop);
  }
}

/* ══════════ 페이드 전환 ══════════ */
const FADE_MAX=18; let fadeAlpha=0, fadeState=0; // 0 none,1 out,2 in
let fadeAction=null;
function startFade(action){ if(fadeState)return; fadeState=1; fadeAction=action; }
function updateFade(){
  if(fadeState===1){ fadeAlpha+=1/FADE_MAX; if(fadeAlpha>=1){fadeAlpha=1; if(fadeAction)fadeAction(); fadeState=2;} }
  else if(fadeState===2){ fadeAlpha-=1/FADE_MAX; if(fadeAlpha<=0){fadeAlpha=0; fadeState=0;} }
}

/* ══════════ 이동 업데이트 ══════════ */
const SPEED=0.00225;   // 이동 속도 절반(과학관 넓게 느껴지게)
function update(){
  updateFade();
  updateParts();
  updatePops();
  computeBgRect();   // clamp가 현재 화면 배치를 알아야 함(cover 시 캐릭터 화면이탈 방지)
  if(fadeState){ player.vx=player.vy=0; }
  else{
    // 이동 방향 → 스프라이트 방향
    if(Math.abs(player.vx)>0.0004||Math.abs(player.vy)>0.0004){
      if(Math.abs(player.vx)>Math.abs(player.vy)) player.dir=player.vx>0?"right":"left";
      else player.dir=player.vy>0?"down":"up";
    }
    const sc=curScene(), obs=sc.obstacles;
    // 축별 이동 + 장애물(전시물·벽) 충돌 → 벽 따라 미끄러짐
    const nx=player.px+player.vx; if(!hitObs(obs,nx,player.py)) player.px=nx;
    const ny=player.py+player.vy; if(!hitObs(obs,player.px,ny)) player.py=ny;
    // 걸을 수 있는 영역 경계 clamp. walkable=[x0,y0,x1,y1] 비율
    const wa=sc.walkable;
    if(wa){ player.px=clamp(player.px,wa[0],wa[2]); player.py=clamp(player.py,wa[1],wa[3]); }
    else { player.px=clamp(player.px,0.04,0.96); player.py=clamp(player.py,0.06,0.95); }
    // 자동 전환 존(zones): 계단 끝까지 걸어 올라가면 버튼 없이 층 전환 ("보이는 대로 동작")
    // 모달(전시 팝업·지도) 열려 있으면 전환 보류 — 팝업 뒤 층전환 방지 (codex R1)
    const modalOpen=document.getElementById("exhibit").classList.contains("show")||document.getElementById("map").classList.contains("show");
    if(!inRoom&&!fadeState&&!modalOpen){
      const zs=FLOORS[floorIdx].zones;
      if(zs)for(const z of zs){
        if(player.px>=z.rect[0]&&player.py>=z.rect[1]&&player.px<=z.rect[2]&&player.py<=z.rect[3]){
          const ti=FLOORS.findIndex(fl=>fl.id===z.to);
          if(ti>=0){ sfx(600,0.10,"triangle"); startFade(()=>enterFloor(ti)); }
          break;
        }
      }
    }
  }
  // 근접 핫스팟 (확대된 맵 기준이라 화면상 100px 이내를 근접으로)
  let best=null,bd=1e9;
  const f=curScene();
  f.spots.forEach(sp=>{
    const dx=(sp.x-player.px)*bgRect.w, dy=(sp.y-player.py)*bgRect.h;
    const d=Math.hypot(dx,dy);
    if(d<135&&d<bd){bd=d;best=sp;}
  });
  if(best!==nearSpot){ nearSpot=best; updateFloorTag(); updateAbtn(); }
  // NPC: 보안 순찰 이동 + 근접 감지(nearSpot과 별개, 공존)
  updateNPCs();
  updateNearNPC();
  // 카메라 부드럽게 따라옴(공간감)
  camX+=(player.px-camX)*0.11; camY+=(player.py-camY)*0.11;
  // 화면 흔들림 감쇠
  if(shake>0.3){ shake*=0.85; shX=(Math.random()-0.5)*shake; shY=(Math.random()-0.5)*shake; }
  else { shake=0; shX=shY=0; }
}
function npcWins(){   // 최근접 우선(2026-07-28): 스팟·NPC 중 가까운 쪽이 A버튼 차지
  if(!nearNPC)return false;
  if(!nearSpot)return true;
  const dN=Math.hypot((nearNPC.x-player.px)*bgRect.w,(nearNPC.y-player.py)*bgRect.h);
  const dS=Math.hypot((nearSpot.x-player.px)*bgRect.w,(nearSpot.y-player.py)*bgRect.h);
  return dN<dS;
}
function updateAbtn(){
  const a=document.getElementById("abtn"), lb=document.getElementById("alabel"), ic=a.querySelector(".ai");
  if(npcWins()){
    a.classList.add("on"); ic.textContent=nearNPC.type==="guide"?"🧑‍🏫":nearNPC.type==="cleaning"?"🧹":"👮"; lb.textContent="대화";
  }else if(nearSpot){
    a.classList.add("on");
    if(nearSpot.kind==="elevator"){ic.textContent="🛗";lb.textContent="층 이동";}
    else if(nearSpot.kind==="stair"){ic.textContent="🪜";lb.textContent="계단";}
    else if(nearSpot.kind==="gate"){ic.textContent=nearSpot.icon||"🚪";lb.textContent=nearSpot.label||"이동";}

/* ══════════ 조작: 조이스틱 (Pointer Events + pointerId 추적 → 멀티터치 안전) ══════════ */
(function(){
  const stick=document.getElementById("stick"), nub=document.getElementById("nub");
  let pid=null, cx=0, cy=0, R=44;   // pid=이 조이스틱을 잡은 포인터만 처리
  function start(e){
    if(pid!==null)return;           // 이미 다른 손가락이 조이스틱 잡음
    pid=e.pointerId;
    const r=stick.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2;
    try{stick.setPointerCapture(pid);}catch(_){}
    move(e);
  }
  function move(e){
    if(e.pointerId!==pid)return; e.preventDefault();
    let dx=e.clientX-cx, dy=e.clientY-cy;
    const d=Math.hypot(dx,dy); if(d>R){dx=dx/d*R; dy=dy/d*R;}
    nub.style.transform="translate("+dx+"px,"+dy+"px)";
    player.vx=dx/R*SPEED; player.vy=dy/R*SPEED;
  }
  function end(e){
    if(e.pointerId!==pid)return;
    pid=null; nub.style.transform=""; player.vx=player.vy=0;
  }
  stick.addEventListener("pointerdown",start);
  stick.addEventListener("pointermove",move);
  stick.addEventListener("pointerup",end);
  stick.addEventListener("pointercancel",end);
  // 키보드(테스트)
  const keys={};
  window.addEventListener("keydown",e=>{keys[e.key]=1;applyKeys();});
  window.addEventListener("keyup",e=>{keys[e.key]=0;applyKeys();});
  function applyKeys(){
    let vx=0,vy=0;
    if(keys.ArrowLeft||keys.a)vx-=1; if(keys.ArrowRight||keys.d)vx+=1;
    if(keys.ArrowUp||keys.w)vy-=1; if(keys.ArrowDown||keys.s)vy+=1;
    const d=Math.hypot(vx,vy)||1; player.vx=vx/d*SPEED*(vx||vy?1:0); player.vy=vy/d*SPEED*(vx||vy?1:0);
    if(!vx&&!vy){player.vx=player.vy=0;}
  }
})();

/* ══════════ 도감·점수 (수집 가시화 = 박물관 게임 1순위) ══════════ */
const ALL_EXHIBITS=[], EXHIBIT_BY_QID={};
function _pushExhibits(sceneId,scene){ scene.spots.forEach(s=>{
  if(s.kind==="exhibit"){
    const e={roomId:sceneId,room:scene.name,name:s.name,icon:s.icon,info:s.info,qid:s.qid,khash:s.khash}; ALL_EXHIBITS.push(e);
    if(s.qid&&!EXHIBIT_BY_QID[s.qid])EXHIBIT_BY_QID[s.qid]=e;
  }}); }
FLOORS.forEach(f=>_pushExhibits(f.id,f));
Object.entries(ROOMS).forEach(([roomId,r])=>_pushExhibits(roomId,r));
const EXHIBIT_TOTAL=ALL_EXHIBITS.length;
function checkExhibitQids(){
  const missing=ALL_EXHIBITS.filter(e=>!e.qid).map(e=>e.name);
  const missingHash=ALL_EXHIBITS.filter(e=>!e.khash).map(e=>e.qid||e.name);
  const invalid=ALL_EXHIBITS.filter(e=>e.qid&&!/^[a-z-]+$/.test(e.qid)).map(e=>e.qid);
  const invalidHash=ALL_EXHIBITS.filter(e=>e.khash&&!/^[0-9a-f]{64}$/i.test(e.khash)).map(e=>e.qid);
  const count={}; ALL_EXHIBITS.forEach(e=>{if(e.qid)count[e.qid]=(count[e.qid]||0)+1;});
  const duplicate=Object.keys(count).filter(qid=>count[qid]>1);
  if(EXHIBIT_TOTAL!==25)console.warn("전시물 수가 25개가 아닙니다:",EXHIBIT_TOTAL);
  if(missing.length)console.warn("qid 누락 전시물:",missing);
  if(missingHash.length)console.warn("khash 누락 전시물:",missingHash);
  if(invalid.length)console.warn("qid 형식 오류(소문자·하이픈만 허용):",invalid);
  if(invalidHash.length)console.warn("khash 형식 오류(SHA-256 hex 필요):",invalidHash);
  if(duplicate.length)console.warn("qid 중복:",duplicate);
}
checkExhibitQids();
function seenMap(){ try{const o=JSON.parse(safeGet("ssc_seen")||"{}"); return (o&&typeof o==="object"&&!Array.isArray(o))?o:{};}catch(e){return {};} }
function isSeen(name){ return !!seenMap()[name]; }
function seenCount(){ const s=seenMap(); return ALL_EXHIBITS.filter(e=>s[e.name]).length; }
// silent=true면 점수 팝업을 띄우지 않는다(현장 QR 인증처럼 자체 팝업이 따로 있는 경우)
function markSeen(name,silent){ const s=seenMap(); if(!s[name]){ s[name]=1; safeSet("ssc_seen",JSON.stringify(s)); if(silent)updateScore(); else popScore("+5 관람"); } }
function scanMap(){ try{const o=JSON.parse(safeGet("ssc_scan")||"{}"); return (o&&typeof o==="object"&&!Array.isArray(o))?o:{};}catch(e){return {};} }
// hasOwn 가드: ?scan=__proto__ · ?scan=constructor 같은 값이 프로토타입 체인에 걸려 오탐되는 것 방지
function isScanned(qid){ return Object.hasOwn(scanMap(),qid); }
function scanCount(){ const s=scanMap(); return ALL_EXHIBITS.filter(e=>e.qid&&Object.hasOwn(s,e.qid)).length; }
function exhibitByQid(qid){ return Object.hasOwn(EXHIBIT_BY_QID,qid)?EXHIBIT_BY_QID[qid]:null; }
function markScanned(qid){
  if(isScanned(qid))return "duplicate";
  const s=scanMap(); s[qid]=new Date().toISOString();
  if(!safeSet("ssc_scan",JSON.stringify(s)))return "failed";
  return isScanned(qid)?"saved":"failed";
}
function getScore(){ return gotCount()*10 + seenCount()*5 + scanCount()*20; }   // 스탬프 10점 · 전시물 5점 · 현장 인증 20점
function getLevel(){
  const scans=scanCount(), score=getScore();
  if(scans>=8)return {lv:5,name:"과학관 마스터"};
  if(scans>=3)return {lv:4,name:"현장 인증"};              // Lv4·5는 온라인 점수로 우회 불가
  if(gotCount()>=3||score>=120)return {lv:3,name:"연구원"};
  if(score>=50)return {lv:2,name:"탐험가"};
  return {lv:1,name:"방문객"};
}

  if(gotCount()>=3) b.push({icon:"🎮",name:"게이머"});

  if(getScore()>=100) b.push({icon:"💯",name:"100점 돌파"});
  return b;
}

/* ══════════ 현장 QR 인증 ══════════ */
function removeScanParam(){
  const url=new URL(location.href); url.searchParams.delete("scan"); url.searchParams.delete("k");
  history.replaceState(history.state,"",url.pathname+url.search+url.hash);
}
async function handleScanParam(qid,key,exhibit){
  if(!exhibit){ toast("인식할 수 없는 QR이에요"); return; }
  if(key==null||!key.trim()){ toast("QR을 직접 찍어야 인증돼요"); return; }
  if(!exhibit.khash){ toast("인증할 수 없는 QR이에요"); return; }
  const subtle=globalThis.crypto&&globalThis.crypto.subtle;
  if(!subtle){ toast("안전한 연결에서만 QR 인증할 수 있어요"); return; }
  const normalized=key.trim().toUpperCase();
  let actual;
  try{
    const bytes=new TextEncoder().encode(qid+":"+normalized);
    const digest=await subtle.digest("SHA-256",bytes);
    actual=Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,"0")).join("");
  }catch(e){
    console.warn("QR SHA-256 검증 실패:",e);
    toast("안전한 연결에서만 QR 인증할 수 있어요"); return;
  }
  if(actual.toLowerCase()!==exhibit.khash.toLowerCase()){ toast("인증할 수 없는 QR이에요"); return; }
  // ⚠️ before는 반드시 markScanned 앞에서 찍는다. 뒤에서 찍으면 스캔 +20이 이미 반영돼 델타가 +5로 나온다.
  const before=getScore();
  const scanResult=markScanned(qid);
  if(scanResult==="duplicate"){ toast("이미 인증한 전시물이에요"); return; }
  if(scanResult!=="saved"){ toast("인증 기록을 저장할 수 없어요. 브라우저 저장 공간을 확인해 주세요"); return; }
  // 현장에서 실물을 봤으므로 도감도 함께 기록(silent). 게임에서 아직 안 본 전시물이면 관람(+5)이 같이 붙어
  // 실제 획득은 +25가 된다 → 팝업은 실측 증가분을 그대로 보여준다(표시와 실제가 어긋나면 안 됨).
  markSeen(exhibit.name,true);
  const delta=getScore()-before;
  popScore("+"+delta+" 현장 인증");
  const cx=bgRect.w?s2x(player.px):W/2, cy=bgRect.h?s2y(player.py):H/2;
  burst(cx,cy,"#f6b93b",42); burst(cx,cy,"#4caf50",34); burst(cx,cy,"#ef8c3b",24); shake=24;
  sfxChord([523,659,784,1047,1319],0.18);
  setTimeout(()=>{burst(W/2,H*0.38,"#f6b93b",36);sfxChord([784,988,1175,1568],0.16);},140);
  document.getElementById("scanIcon").textContent=exhibit.icon||"📍";
  document.getElementById("scanName").textContent=exhibit.name;
  document.getElementById("scanPoints").textContent="+"+delta+"점";
  document.getElementById("scanCheer").classList.add("show");
}

function drawMiniMap(mc){

  };
  FLOORS.forEach(f=>appendCatalogScene(f,f.name));
  Object.values(ROOMS).forEach(r=>appendCatalogScene(r,r.floorName+' · '+r.name));
  document.getElementById("map").classList.add("show");
};

/* ══════════ 수료증 ══════════ */
document.getElementById("certBtn").onclick=()=>{ if(fadeState)return; showCert(); };
document.getElementById("soundBtn").onclick=()=>{ sndOn=!sndOn;
  document.getElementById("soundBtn").textContent=sndOn?"🔊":"🔇"; if(sndOn)sfx(660,0.08); };
function showCert(){
  refreshDone(); const n=gotCount();
  const full=n>=STAMP_TOTAL;
  document.getElementById("certStars").textContent="⭐".repeat(Math.min(n,STAMP_TOTAL))+"☆".repeat(Math.max(0,STAMP_TOTAL-n));
  document.getElementById("certCount").textContent=n+" / "+STAMP_TOTAL+" 스탬프  ·  ⭐ "+getScore()+"점";
  const badges=getBadges();
  const bhtml=badges.length
    ? '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px">'+
        badges.map(b=>'<div style="background:#fff7e6;border:2px solid #f6b93b;border-radius:12px;padding:6px 11px;font-size:12px;font-weight:800">'+b.icon+' '+b.name+'</div>').join('')+'</div>'
    : '<div style="font-size:13px;color:#8a8069;margin:12px 0 4px">아직 배지가 없어요 — 전시물을 관람하고 미니게임을 해보세요!</div>';
  document.getElementById("certMsg").innerHTML=(full
    ? "🎊 <b>축하합니다!</b><br>모든 전시실을 탐방했어요!"
    : "아직 <b>"+(STAMP_TOTAL-n)+"개</b>의 스탬프가 남았어요.")+bhtml;
  document.getElementById("cert").classList.add("show");
}

/* ══════════ 모달 닫기 ══════════ */
function closeModals(){ document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show")); }
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModals);
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeModals();}));

/* ══════════ 토스트 ══════════ */
/* ══════════ 전시물·시설 관람 팝업 ══════════ */
function showExhibit(sp){
  if(sp.kind==="exhibit") markSeen(sp.name);   // 도감 기록 + 점수(+5)
  document.getElementById("exhibitIcon").textContent=sp.icon||"🔍";
  document.getElementById("exhibitName").textContent=sp.name;
  document.getElementById("exhibitInfo").textContent=sp.info||"";
  document.getElementById("exhibit").classList.add("show");
}

let toastT=null;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1900);
}

/* ══════════ 복귀(BFCache 포함) ══════════ */
window.addEventListener("pageshow",e=>{ refreshDone(); updateScore(); setTimeout(checkNewStamps,200); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){refreshDone();updateScore();} });

/* ══════════ 시작 ══════════ */
/* ══════════ 홈 화면 추가(전체화면) 자동 안내 ══════════ */
(function(){
  const el=document.getElementById("a2hs"); if(!el)return;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=navigator.standalone||matchMedia("(display-mode:standalone)").matches||matchMedia("(display-mode:fullscreen)").matches;
  let dp=null;
  function show(mode){ if(standalone)return;
    document.getElementById("a2hsMsg").textContent = (mode==="install")
      ? "📲 앱으로 설치하면 전체화면으로 즐길 수 있어요!"
      : '📲 공유 버튼 → "홈 화면에 추가"하면 전체화면!';
    document.getElementById("a2hsBtn").style.display = (mode==="install")?"":"none";
    el.style.display="flex";
  }
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); dp=e; if(!safeGet("a2hs_seen"))show("install"); });
  document.getElementById("a2hsBtn").onclick=async()=>{ if(dp){dp.prompt();dp=null;} el.style.display="none"; };
  document.getElementById("a2hsX").onclick=()=>{ el.style.display="none"; safeSet("a2hs_seen","1"); };
  if(isIOS && !standalone && !safeGet("a2hs_seen")) setTimeout(()=>show("ios"),1800);
})();

refreshDone(); updateScore();
preload();
console.log("과학관 탐방 "+HUB_VERSION+" · 스탬프 "+STAMP_TOTAL+"개");
</script>
