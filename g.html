<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>분리배출 메모리 매치 — G전시실</title>
<style>
  :root{
    /* 포레스트그린 + 테라코타, 흙·나무 질감 톤 (네이비 금지) */
    --bg:#141f17; --bg2:#1e2c20; --bg3:#28392a; --line:#3d5240;
    --ink:#f5ecd9; --muted:#a7b89f;
    --terracotta:#c1683f; --terracotta-d:#8f4726;
    --moss:#5c8a5a; --moss-d:#3c6b3a;
    --amber:#e0a458; --red:#d1544a;
    --paper:#c9a06e; --plastic:#4a90e2; --canm:#b7c9b0; --general:#8a8f74;
    --kr:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --head:Georgia,'Apple SD Gothic Neo',var(--kr),serif;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #24361f 0%, var(--bg) 60%),
      repeating-linear-gradient(115deg, rgba(193,104,63,.035) 0 2px, transparent 2px 26px);
    color:var(--ink);font-family:var(--kr);line-height:1.65;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    position:fixed;inset:0;height:100dvh;
    padding:calc(8px + env(safe-area-inset-top)) 8px calc(10px + env(safe-area-inset-bottom));gap:7px;
    user-select:none;-webkit-user-select:none;touch-action:none}

  .backBtn{position:fixed;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));
    z-index:30;background:var(--bg2);border:1.5px solid var(--terracotta-d);color:var(--muted);
    border-radius:11px;height:32px;padding:0 12px;font-size:12.5px;font-weight:700;
    cursor:pointer;font-family:var(--kr);text-decoration:none;display:flex;align-items:center;gap:4px}

  .wrap{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;align-items:center;gap:7px}

  .hud{width:min(94vw,430px);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:36px}
  .timerBox{display:flex;align-items:baseline;gap:6px;background:var(--bg2);border:1.5px solid var(--line);
    border-radius:12px;padding:6px 14px}
  .timer-ic{font-size:14px}
  .timer{font-family:var(--head);font-weight:700;font-size:26px;line-height:1;color:var(--ink)}
  .timer.low{color:var(--red)}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  .timer.low{animation:pulse .5s infinite alternate}
  .roundBox{font-family:var(--head);font-weight:700;font-size:15px;color:var(--amber);
    background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;white-space:nowrap}
  .roundBox .roundTotal{color:var(--muted);font-size:12px;font-weight:600}
  .btn-ic{background:var(--bg2);border:1.5px solid var(--line);color:var(--muted);
    border-radius:12px;height:38px;padding:0 12px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:var(--kr);white-space:nowrap}

  .row2{width:min(94vw,430px);display:flex;justify-content:space-between;align-items:center;
    gap:8px;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px}
  .row2 .stat{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .row2 .stat b{color:var(--ink);font-family:var(--head);font-weight:700;font-size:13.5px}

  .stageWrap{position:relative;flex:1;min-height:0;width:min(94vw,430px);
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--line);border-radius:18px;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 40%);padding:6px}

  .card-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);
    gap:6px;align-content:center;overflow-y:auto}

  .card{position:relative;width:100%;aspect-ratio:.82;background:none;border:none;padding:0;
    cursor:pointer;perspective:600px;touch-action:manipulation}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .38s cubic-bezier(.2,.7,.3,1.15);
    transform-style:preserve-3d}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card-back,.card-front{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .card-back{
    background:
      repeating-linear-gradient(135deg, var(--terracotta) 0 8px, var(--terracotta-d) 8px 16px);
    border:1.5px solid #6b3a22;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
  .card-back::after{content:"♻️";font-size:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
  .card-front{transform:rotateY(180deg);border:1.5px solid var(--line);gap:2px;padding:4px 2px}
  .card-front.item{background:#efe3c8;color:#2f4a2f}
  .card-front.bin{background:linear-gradient(160deg,var(--moss),var(--moss-d));color:#f5ecd9}
  .cf-ic{font-size:22px;line-height:1}
  .cf-lb{font-size:9.5px;font-weight:700;text-align:center;line-height:1.2;padding:0 2px}

  .card.matched{pointer-events:none}
  .card.matched .card-inner{animation:popMatch .5s ease}
  .card.matched .card-front{opacity:.55}
  .card.matched .cf-ic{animation:icPop .5s ease}
  @keyframes popMatch{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.14)}100%{transform:rotateY(180deg) scale(1)}}
  @keyframes icPop{0%{transform:scale(1)}45%{transform:scale(1.5)}100%{transform:scale(1)}}

  .card.wrong .card-inner{animation:cardShake .42s}
  @keyframes cardShake{0%,100%{transform:rotateY(180deg) translateX(0)}20%{transform:rotateY(180deg) translateX(-6px)}
    40%{transform:rotateY(180deg) translateX(6px)}60%{transform:rotateY(180deg) translateX(-4px)}80%{transform:rotateY(180deg) translateX(4px)}}

  /* 팩트 토스트 */
  .toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%) translateY(90px);
    width:calc(100% - 20px);max-width:390px;background:rgba(20,30,22,.95);
    border:1.5px solid var(--moss);border-radius:14px;padding:11px 14px;
    display:flex;gap:11px;align-items:center;opacity:0;visibility:hidden;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s,visibility .3s;
    pointer-events:none;z-index:6}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
  .toast .dot{width:34px;height:34px;border-radius:50%;flex-shrink:0}
  .toast b{font-size:13px;display:block;color:var(--moss)}
  .toast p{font-size:12px;color:#e7e0cd;line-height:1.45;margin-top:1px}

  /* 콤보 팝업 */
  .comboPop{position:absolute;top:6px;left:50%;transform:translateX(-50%) translateY(0);
    font-family:var(--head);font-weight:700;font-size:15px;color:var(--terracotta);
    background:rgba(20,30,22,.9);border:1.5px solid var(--terracotta);border-radius:20px;
    padding:6px 16px;opacity:0;pointer-events:none;z-index:6;white-space:nowrap}
  .comboPop.pop{animation:comboFloat .9s ease}
  @keyframes comboFloat{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.9)}
    20%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.05)}
    70%{opacity:1;transform:translateX(-50%) translateY(-10px) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(1)}}

  /* 라운드 클리어 안내 */
  .roundNote{position:absolute;inset:0;background:rgba(15,22,16,.88);backdrop-filter:blur(3px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:20px;z-index:8;border-radius:16px;transition:opacity .2s}
  .roundNote.hide{opacity:0;pointer-events:none}
  .roundNote h2{font-family:var(--head);font-size:22px;color:var(--amber)}
  .roundNote p{font-size:12.5px;color:var(--muted);margin-top:10px}
  .roundNote .tap{margin-top:16px;font-size:12px;color:var(--terracotta);font-weight:700}

  /* 오버레이 */
  .ov{position:fixed;inset:0;background:rgba(10,15,11,.9);backdrop-filter:blur(5px);
    display:flex;flex-direction:column;align-items:stretch;justify-content:center;
    text-align:center;padding:28px;z-index:20;transition:opacity .25s;overflow-y:auto;overflow-x:hidden}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font-family:var(--head);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
  .ov h1 em{font-style:normal;color:var(--terracotta)}
  .ov .sub{font-size:12.5px;color:var(--muted);margin-top:12px}
  .go{align-self:center;margin-top:22px;font-family:var(--kr);font-weight:800;font-size:17px;
    background:var(--terracotta);color:#2a140a;border:none;border-radius:16px;
    padding:15px 44px;cursor:pointer;box-shadow:0 5px 0 var(--terracotta-d);transition:transform .08s}
  .go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--terracotta-d)}
  .howto{display:flex;align-items:center;gap:8px;margin:20px 0 6px;flex-wrap:wrap;justify-content:center}
  .step{background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;
    padding:12px 10px;width:100px}
  .step-ic{font-size:24px;margin-bottom:6px}
  .step p{font-size:11.5px;color:#e7e0cd;line-height:1.45}
  .step p b{color:var(--moss)}
  .step-arrow{color:var(--muted);font-size:15px;font-weight:800}
  .backlink{margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none}
  @media (max-height:760px){
    .ov h1{font-size:21px}
    .howto{margin:12px 0 4px}
    .step{padding:9px 8px;width:90px}
    .step-ic{font-size:20px;margin-bottom:4px}
    .go{margin-top:14px;padding:12px 38px}
    .ov .sub{margin-top:5px}
  }
  .ov .final-score{font-family:var(--head);font-weight:700;font-size:48px;color:var(--terracotta);line-height:1.1}
  .ov .final-label{font-size:13px;color:var(--muted);letter-spacing:.08em}
  .ov .final-grade{margin-top:8px;font-family:var(--head);font-weight:700;font-size:19px;color:var(--ink)}
  .ov .final-max{margin-top:10px;font-size:14px;color:#e7e0cd}

  .vtag{position:fixed;right:8px;bottom:6px;font-size:10px;color:#54604f;font-family:var(--head);z-index:50}
</style>
</head>
<body>

<a class="backBtn" href="h.html">← 허브</a>

<div class="wrap">
  <div class="hud">
    <div class="timerBox"><span class="timer-ic">⏱</span><span class="timer" id="timer">90</span></div>
    <div class="roundBox">R<span id="roundNo">1</span><span class="roundTotal">/3</span></div>
    <button class="btn-ic" id="muteBtn" aria-label="효과음 켜기/끄기">🔊</button>
  </div>
  <div class="row2">
    <div class="stat">매치 <b id="matchTxt">0/6</b></div>
    <div class="stat">정확도 <b id="accTxt">-</b></div>
    <div class="stat">콤보 <b id="comboTxt">x0</b></div>
  </div>
  <div class="stageWrap">
    <div class="card-grid" id="grid"></div>
    <div class="toast" id="toast"><div class="dot" id="toastDot"></div><div><b id="toastTitle"></b><p id="toastBody"></p></div></div>
    <div class="comboPop" id="comboPop"></div>
    <div class="roundNote hide" id="roundNote">
      <h2 id="roundNoteTitle">라운드 1 클리어!</h2>
      <p id="roundNoteSub">다음 라운드는 카드가 더 많아져요</p>
      <div class="tap">화면을 탭해서 계속</div>
    </div>
  </div>
</div>

<div class="ov" id="intro">
  <h1>분리배출 메모리 매치<br><em>짝을 맞히면 자원, 헷갈리면 다시 뒤집혀요</em></h1>
  <div class="howto">
    <div class="step"><div class="step-ic">🔎</div><p>카드 두 장을<br><b>뒤집어</b> 봐요</p></div>
    <div class="step-arrow">→</div>
    <div class="step"><div class="step-ic">🔗</div><p><b>아이템</b>과<br>맞는 <b>통</b>이면 매치!</p></div>
    <div class="step-arrow">→</div>
    <div class="step"><div class="step-ic">⏱</div><p><b>90초</b> 안에<br>3라운드 완주</p></div>
  </div>
  <p class="sub">재활용은 자원순환이에요 — 제대로 분류해야 자원, 섞이면 쓰레기가 돼요</p>
  <button class="go" id="startBtn">매치 시작</button>
</div>

<div class="ov hide" id="over">
  <div class="final-label" id="overTitle">⏱ 매치 종료!</div>
  <div class="final-score" id="finalScore">0</div>
  <div class="final-grade" id="finalGrade"></div>
  <div class="final-max" id="finalMax"></div>
  <button class="go" id="retryBtn">다시 도전</button>
  <a href="h.html" class="backlink">🏛 과학관 허브로 돌아가기</a>
</div>

<script>
"use strict";

// ===== 상수 =====
const VERSION="v1.0 · 메모리매치"; // 분리배출 메모리 매치 — G전시실(공존) 미니게임, g.html 리워크
const TIME_LIMIT=90;
const PAIRS_PER_ROUND=[6,8,10];
const BIN_LABEL={paper:"종이",plastic:"플라스틱",can:"캔·금속",general:"일반"};
const BIN_ICON={paper:"📄",plastic:"♻️",can:"🥫",general:"🗑"};

// 아이템 도감 — 기존 g.html ITEMS 그대로(이름·분류·함정팩트 동일), emoji만 카드 렌더링용으로 추가
const ITEMS=[
 {id:"newspaper",name:"신문지",cat:"paper",emoji:"📰"},
 {id:"cardbox",name:"종이상자",cat:"paper",emoji:"📦"},
 {id:"book",name:"책",cat:"paper",emoji:"📕"},
 {id:"petbottle",name:"페트병",cat:"plastic",emoji:"🧴"},
 {id:"yogurt",name:"요구르트통",cat:"plastic",emoji:"🥛"},
 {id:"shampoo",name:"샴푸통",cat:"plastic",emoji:"🧴"},
 {id:"can",name:"음료캔",cat:"can",emoji:"🧃"},
 {id:"cannedfood",name:"통조림",cat:"can",emoji:"🥫"},
 {id:"spoon",name:"숟가락",cat:"can",emoji:"🥄"},
 {id:"tissue",name:"휴지",cat:"general",emoji:"🧻"},
 {id:"toothpick",name:"이쑤시개",cat:"general",emoji:"🥢"},
 {id:"diaper",name:"기저귀",cat:"general",emoji:"👶"},
 {id:"chickenbox",name:"치킨상자(기름)",cat:"general",trap:true,emoji:"🍗",
   trapFact:"기름·음식물이 묻은 종이는 재활용이 안 돼요 — 일반쓰레기로!"},
 {id:"pizzabox",name:"피자상자(기름)",cat:"general",trap:true,emoji:"🍕",
   trapFact:"피자상자도 기름이 배면 종이로 재활용할 수 없어요. 깨끗한 부분만 뜯어서 배출해요."},
 {id:"cupdrink",name:"테이크아웃컵(내용물)",cat:"general",trap:true,emoji:"🥤",
   trapFact:"컵에 음료가 남아있으면 일반쓰레기예요. 비우고 헹궈야 재활용이 가능해요!"}
];
// 기존 g.html GENERAL_FACTS 그대로 (캔/플라스틱 매치 시 노출)
const GENERAL_FACTS={
 can:{c:"#4cd787",t:"♻️ 알루미늄 캔",b:"알루미늄 캔을 재활용하면 새로 만들 때보다 에너지를 약 95% 아낄 수 있어요."},
 plastic:{c:"#4a90e2",t:"⏳ 플라스틱",b:"플라스틱은 자연에서 분해되는 데 수백 년이 걸려요."}
};

// ===== 상태 =====
let started=false,overFlag=false,muted=false,busy=false,finished=false;
let roundIdx=0,roundMatched=0;
let totalMatched=0,totalMismatch=0,combo=0,bestCombo=0,score=0;
let best=+(localStorage.getItem("recycle_best")||0);
let timeLeft=TIME_LIMIT;
let flipped=[]; // 현재 뒤집힌 카드 el 배열(최대 2)
let deck=[];    // 현재 라운드 카드 데이터
let lastT=performance.now();
let rafId=null;

addEventListener("load",()=>scrollTo(0,0));
addEventListener("resize",()=>scrollTo(0,0));

// ===== 사운드 (WebAudio 합성 — 에셋/CDN 0) =====
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(f0,f1,dur,type,vol){
  if(muted)return; const a=ac(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),a.currentTime+dur);
  g.gain.setValueAtTime(vol||.15,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);
}
const sMatch=c=>beep(440+Math.min(c,10)*30,860+Math.min(c,10)*40,.16,"triangle",.15);
const sWrong=()=>beep(220,90,.22,"sawtooth",.13);
const sRound=()=>beep(500,900,.3,"triangle",.14);
const sOver=()=>beep(400,80,.7,"sawtooth",.1);

// ===== 유틸 =====
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function pickItemsForRound(n){
  return shuffle(ITEMS.slice()).slice(0,n);
}

// ===== 라운드 구성 =====
function buildRound(){
  const n=PAIRS_PER_ROUND[roundIdx];
  const items=pickItemsForRound(n);
  const cards=[];
  items.forEach((it,i)=>{
    cards.push({kind:"item",item:it,uid:"i"+i});
    cards.push({kind:"bin",cat:it.cat,uid:"b"+i});
  });
  shuffle(cards);
  deck=cards;
  roundMatched=0;
  flipped=[];busy=false;
  document.getElementById("roundNo").textContent=roundIdx+1;
  document.getElementById("matchTxt").textContent=`0/${n}`;
  renderGrid();
}
function renderGrid(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  deck.forEach((c,idx)=>{
    const btn=document.createElement("button");
    btn.className="card";
    btn.dataset.idx=idx;
    const ic=c.kind==="item"?c.item.emoji:BIN_ICON[c.cat];
    const lb=c.kind==="item"?c.item.name:BIN_LABEL[c.cat];
    btn.innerHTML=`<div class="card-inner">
      <div class="card-back"></div>
      <div class="card-front ${c.kind}"><span class="cf-ic">${ic}</span><span class="cf-lb">${lb}</span></div>
    </div>`;
    btn.addEventListener("pointerdown",onCardTap);
    grid.appendChild(btn);
  });
}

// ===== 판정 로직 =====
function onCardTap(e){
  e.preventDefault();
  ac()&&AC.resume&&AC.resume();
  if(!started||overFlag||busy)return;
  const el=e.currentTarget,idx=+el.dataset.idx,c=deck[idx];
  if(!c||c.matched||el.classList.contains("flipped"))return;
  if(flipped.length>=2)return;
  el.classList.add("flipped");
  flipped.push(el);
  if(flipped.length===2){
    busy=true;
    setTimeout(judgePair,420);
  }
}
function judgePair(){
  if(finished)return; // 게임이 이미 종료된 뒤 지연 실행되는 판정은 무시
  const [elA,elB]=flipped;
  const a=deck[+elA.dataset.idx],b=deck[+elB.dataset.idx];
  const catA=a.kind==="item"?a.item.cat:a.cat;
  const catB=b.kind==="item"?b.item.cat:b.cat;
  const kindsDiffer=a.kind!==b.kind;
  const match=kindsDiffer&&catA===catB;
  if(match){
    a.matched=b.matched=true;
    elA.classList.add("matched");elB.classList.add("matched");
    totalMatched++;roundMatched++;combo++;bestCombo=Math.max(bestCombo,combo);
    const mult=Math.min(10,combo);
    score+=100*mult;
    if(score>best){best=score;localStorage.setItem("recycle_best",best);}
    sMatch(combo);
    updateHUD();
    const itemObj=a.kind==="item"?a.item:b.item;
    showFactFor(itemObj);
    if(combo>=2)popCombo(combo);
    flipped=[];busy=false;
    checkRoundDone();
  } else {
    combo=0;totalMismatch++;
    elA.classList.add("wrong");elB.classList.add("wrong");
    sWrong();
    updateHUD();
    setTimeout(()=>{
      elA.classList.remove("flipped","wrong");
      elB.classList.remove("flipped","wrong");
      flipped=[];busy=false;
    },460);
  }
}
function updateHUD(){
  const n=PAIRS_PER_ROUND[roundIdx];
  document.getElementById("matchTxt").textContent=`${roundMatched}/${n}`;
  const attempts=totalMatched+totalMismatch;
  document.getElementById("accTxt").textContent=attempts>0?Math.round(totalMatched/attempts*100)+"%":"-";
  document.getElementById("comboTxt").textContent="x"+combo;
}
let toastTimer=null;
function showToast(color,title,body){
  const el=document.getElementById("toast");
  document.getElementById("toastDot").style.background=color;
  document.getElementById("toastTitle").textContent=title;
  document.getElementById("toastBody").textContent=body;
  el.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),3200);
}
function showFactFor(item){
  if(item.trap){
    showToast("#e0a458",`⚠️ ${item.name}`,item.trapFact);
    return;
  }
  const f=GENERAL_FACTS[item.cat];
  if(f){
    showToast(f.c,f.t,f.b);
  } else {
    showToast("#5c8a5a",`✅ ${item.name} 매치!`,`${BIN_LABEL[item.cat]}로 정확히 분류했어요.`);
  }
}
function popCombo(c){
  const el=document.getElementById("comboPop");
  el.textContent=`🔥 x${c} 콤보!`;
  el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
}

// ===== 라운드 진행 =====
function checkRoundDone(){
  const n=PAIRS_PER_ROUND[roundIdx];
  if(roundMatched<n)return;
  if(roundIdx>=PAIRS_PER_ROUND.length-1){
    // 완주 확정 순간 타이머를 즉시 정지 — 이 뒤로 시간이 흘러 timeout gameOver(false)가
    // 끼어들어 완주 결과(+보너스)를 덮어쓰는 레이스를 원천 차단한다.
    overFlag=true;
    setTimeout(()=>gameOver(true),550);
    return;
  }
  busy=true;
  sRound();
  setTimeout(showRoundNote,500);
}
function showRoundNote(){
  // 대기(500ms) 중 시간초과로 이미 종료됐으면 라운드클리어 안내를 띄우지 않는다
  if(overFlag)return;
  const note=document.getElementById("roundNote");
  document.getElementById("roundNoteTitle").textContent=`라운드 ${roundIdx+1} 클리어!`;
  const nextN=PAIRS_PER_ROUND[roundIdx+1];
  document.getElementById("roundNoteSub").textContent=`다음 라운드는 ${nextN}쌍 — 카드가 더 많아져요`;
  note.classList.remove("hide");
  const advance=()=>{
    if(overFlag)return;
    note.classList.add("hide");
    note.removeEventListener("pointerdown",advance);
    roundIdx++;
    buildRound();
  };
  note.addEventListener("pointerdown",advance);
}

// ===== 등급 =====
function grade(completedAll,acc){
  if(completedAll&&acc>=90)return"S · 분리배출 마스터 ♻️";
  if(completedAll&&acc>=70)return"A · 분리배출 전문가 🌍";
  if(roundIdx>=1||acc>=60)return"B · 분리배출 견습생 🌙";
  return"C · 분리배출 새싹 🌱";
}

// ===== 게임 흐름 =====
function reset(){
  clearTimeout(toastTimer);
  score=0;combo=0;bestCombo=0;totalMatched=0;totalMismatch=0;
  roundIdx=0;timeLeft=TIME_LIMIT;overFlag=false;finished=false;flipped=[];busy=false;
  document.getElementById("timer").textContent=TIME_LIMIT;
  document.getElementById("timer").classList.remove("low");
  document.getElementById("roundNote").classList.add("hide");
  updateHUD();
  buildRound();
}
function gameOver(completedAll){
  if(finished)return; // 첫 종료만 반영(first-wins) — 지연 예약된 두번째 종료 처리는 무시
  finished=true;
  overFlag=true;busy=true;sOver();
  const attempts=totalMatched+totalMismatch;
  const acc=attempts>0?Math.round(totalMatched/attempts*100):0;
  document.getElementById("overTitle").textContent=completedAll?"🎉 전체 매치 완주!":"⏱ 매치 종료!";
  if(completedAll)score+=500; // 완주 보너스
  document.getElementById("finalGrade").textContent=grade(completedAll,acc);
  document.getElementById("finalMax").textContent=`매치 ${totalMatched}쌍 · 정확도 ${acc}% · 최고 콤보 x${bestCombo}`;
  document.getElementById("over").classList.remove("hide");
  const el=document.getElementById("finalScore"),finalScore=score;
  const t0=performance.now(),dur=700;
  (function tick(now){
    const p=Math.min(1,(now-t0)/dur);
    el.textContent=Math.round(finalScore*(1-Math.pow(1-p,3)));
    if(p<1)requestAnimationFrame(tick);
    else el.textContent=finalScore;
  })(t0);
}

// ===== 메인 루프(타이머) =====
function frame(now){
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;
  if(started&&!overFlag){
    timeLeft-=dt;
    const tl=Math.max(0,Math.ceil(timeLeft)),tEl=document.getElementById("timer");
    tEl.textContent=tl;
    tEl.classList.toggle("low",timeLeft<=10);
    if(timeLeft<=0)gameOver(false);
  }
  rafId=requestAnimationFrame(frame);
}

// ===== 시작 =====
updateHUD();
const vTag=document.createElement("div");
vTag.className="vtag";
vTag.textContent=VERSION;
document.body.appendChild(vTag);

document.getElementById("muteBtn").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";};
document.getElementById("startBtn").onclick=()=>{
  ac()&&AC.resume&&AC.resume();
  document.getElementById("intro").classList.add("hide");
  started=true;reset();
};
document.getElementById("retryBtn").onclick=()=>{
  document.getElementById("over").classList.add("hide");
  started=true;reset();
};
lastT=performance.now();
requestAnimationFrame(frame);
</script>
