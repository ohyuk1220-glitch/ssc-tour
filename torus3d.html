<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08060d">
  <title>뒤틀림-토러스 · 과학관의 상징</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060d;
      --panel: rgba(16, 12, 24, 0.84);
      --panel-strong: rgba(11, 8, 17, 0.94);
      --gold: #d8a45e;
      --gold-soft: #f0cc91;
      --copper: #b87333;
      --text: #f7efe3;
      --muted: #c8bcae;
      --line: rgba(216, 164, 94, 0.28);
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-right: max(14px, env(safe-area-inset-right));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --safe-left: max(14px, env(safe-area-inset-left));
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100svh;
    }

    button,
    summary {
      font: inherit;
    }

    button {
      color: inherit;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 42%, rgba(94, 52, 117, 0.13), transparent 38%),
        radial-gradient(circle at 30% 72%, rgba(93, 54, 26, 0.11), transparent 34%),
        linear-gradient(180deg, #0b0812 0%, #07050b 72%, #050408 100%);
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    #stage.is-dragging {
      cursor: grabbing;
    }

    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        var(--safe-top)
        var(--safe-right)
        var(--safe-bottom)
        var(--safe-left);
      pointer-events: none;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, auto) minmax(0, 1fr) minmax(0, auto);
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .back {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(10, 7, 15, 0.68);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      transition:
        border-color 160ms ease,
        background-color 160ms ease,
        transform 160ms ease;
    }

    .back:hover {
      border-color: rgba(240, 204, 145, 0.58);
      background: rgba(30, 20, 39, 0.82);
    }

    .back:active {
      transform: scale(0.97);
    }

    .back:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--gold-soft);
      outline-offset: 3px;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(15px, 4vw, 22px);
      font-weight: 700;
      letter-spacing: -0.025em;
      text-align: center;
      text-overflow: ellipsis;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
      white-space: nowrap;
    }

    .topbar::after {
      width: 82px;
      content: "";
    }

    .bottom-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .gesture-hint {
      margin: 0;
      padding: 6px 11px;
      border: 1px solid rgba(240, 204, 145, 0.14);
      border-radius: 999px;
      background: rgba(8, 6, 13, 0.48);
      color: rgba(247, 239, 227, 0.7);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.01em;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 500ms ease;
    }

    .has-interacted .gesture-hint {
      opacity: 0;
    }

    details.info-card {
      width: min(100%, 560px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(184, 115, 51, 0.08), transparent 45%),
        var(--panel);
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      pointer-events: auto;
    }

    summary {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 17px;
      color: var(--gold-soft);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      content: "";
      transform: rotate(45deg) translateY(-2px);
      transition: transform 180ms ease;
    }

    details[open] summary::after {
      transform: rotate(225deg) translate(-2px, -2px);
    }

    .facts {
      margin: 0;
      padding: 0 17px 17px;
      list-style: none;
    }

    .facts li {
      position: relative;
      margin: 0;
      padding: 10px 0 10px 18px;
      border-top: 1px solid rgba(216, 164, 94, 0.13);
      color: var(--muted);
      font-size: clamp(12px, 3.35vw, 14px);
      line-height: 1.55;
      letter-spacing: -0.02em;
    }

    .facts li::before {
      position: absolute;
      top: 17px;
      left: 1px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(216, 164, 94, 0.68);
      content: "";
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 44%, rgba(103, 58, 125, 0.15), transparent 34%),
        var(--bg);
      opacity: 1;
      visibility: visible;
      transition:
        opacity 550ms ease,
        visibility 550ms ease;
    }

    #loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: grid;
      justify-items: center;
      gap: 15px;
      padding: 24px;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 2px solid rgba(216, 164, 94, 0.18);
      border-top-color: var(--gold-soft);
      border-radius: 50%;
      box-shadow: 0 0 26px rgba(184, 115, 51, 0.14);
      animation: spin 900ms linear infinite;
    }

    #loading.is-error .spinner {
      display: none;
    }

    #loading p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 420px) {
      .ui {
        padding-right: max(10px, env(safe-area-inset-right));
        padding-left: max(10px, env(safe-area-inset-left));
      }

      .topbar {
        gap: 8px;
      }

      .back {
        min-height: 40px;
        padding: 0 11px;
        font-size: 12px;
      }

      .topbar::after {
        width: 68px;
      }

      details.info-card {
        border-radius: 17px;
      }
    }

    @media (max-height: 620px) {
      .gesture-hint {
        display: none;
      }

      summary {
        min-height: 42px;
      }

      .facts li {
        padding-top: 7px;
        padding-bottom: 7px;
        line-height: 1.4;
      }

      .facts li::before {
        top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1800ms;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="viewer">
    <div
      id="stage"
      role="img"
      aria-label="뒤틀림-토러스 3D 모형. 드래그해 회전하고 두 손가락으로 확대하거나 축소할 수 있습니다."
      aria-describedby="viewer-instructions"
    ></div>

    <div class="ui">
      <header class="topbar">
        <button class="back" id="back-button" type="button" aria-label="도감으로 돌아가기">
          ← 도감으로
        </button>
        <h1>뒤틀림-토러스 · 과학관의 상징</h1>
      </header>

      <div class="bottom-area">
        <p class="gesture-hint" aria-hidden="true">드래그로 회전 · 핀치로 확대</p>
        <details class="info-card" open>
          <summary>전시 정보</summary>
          <ul class="facts">
            <li>위상수학 개념으로 우주 공간을 형상화</li>
            <li>구리선과 LED 5,000개 이상</li>
            <li>피보나치 나선 — 솔방울 나선(8줄·13줄)과 같은 원리</li>
          </ul>
        </details>
      </div>
    </div>

    <p class="sr-only" id="viewer-instructions">
      한 손가락이나 마우스로 드래그하면 회전합니다. 두 손가락을 벌리거나 모으면 확대 또는 축소됩니다.
    </p>

    <div id="loading" role="status" aria-live="polite">
      <div class="loader-content">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-message">3D 전시를 불러오는 중…</p>
      </div>
    </div>
  </main>

  <script type="module">
    const LED_COUNT = 5000;
    const AMBIENT_LED_COUNT = 1350;
    const MAX_PIXEL_RATIO = 2;
    const SHEET_HALF_WIDTH = 8.6;
    const SHEET_HALF_DEPTH = 4.45;
    const TAU = Math.PI * 2;
    const CDN_URL = "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

    const viewer = document.getElementById("viewer");
    const stage = document.getElementById("stage");
    const loading = document.getElementById("loading");
    const loadingMessage = document.getElementById("loading-message");
    const backButton = document.getElementById("back-button");

    backButton.addEventListener("click", () => {
      let pageDidHide = false;
      window.addEventListener("pagehide", () => {
        pageDidHide = true;
      }, { once: true });

      if (window.history.length > 1) {
        window.history.back();
        window.setTimeout(() => {
          if (!pageDidHide) window.location.href = "h.html";
        }, 500);
      } else {
        window.location.href = "h.html";
      }
    });

    const showError = (message) => {
      loading.classList.remove("is-hidden");
      loading.classList.add("is-error");
      loadingMessage.textContent = message;
    };

    const seededRandom = (seed) => {
      let value = seed >>> 0;
      return () => {
        value += 0x6d2b79f5;
        let mixed = value;
        mixed = Math.imul(mixed ^ (mixed >>> 15), mixed | 1);
        mixed ^= mixed + Math.imul(mixed ^ (mixed >>> 7), mixed | 61);
        return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
      };
    };

    const random = seededRandom(0x5c1e7a11);

    const gaussianRandom = () => {
      const first = Math.max(Number.EPSILON, random());
      const second = random();
      return Math.sqrt(-2 * Math.log(first)) * Math.cos(TAU * second);
    };

    const poissonSample = (width, depth, minimumDistance, attempts = 24) => {
      const halfWidth = width * 0.5;
      const halfDepth = depth * 0.5;
      const cellSize = minimumDistance / Math.SQRT2;
      const columns = Math.ceil(width / cellSize);
      const rows = Math.ceil(depth / cellSize);
      const grid = new Int32Array(columns * rows);
      grid.fill(-1);

      const points = [];
      const active = [];
      const minimumDistanceSquared = minimumDistance * minimumDistance;

      const insertPoint = (x, z) => {
        const pointIndex = points.length;
        const point = { x, z };
        points.push(point);
        active.push(pointIndex);

        const column = Math.min(columns - 1, Math.floor((x + halfWidth) / cellSize));
        const row = Math.min(rows - 1, Math.floor((z + halfDepth) / cellSize));
        grid[row * columns + column] = pointIndex;
      };

      insertPoint(
        (random() - 0.5) * width,
        (random() - 0.5) * depth
      );

      while (active.length > 0) {
        const activeSlot = Math.floor(random() * active.length);
        const origin = points[active[activeSlot]];
        let accepted = false;

        for (let attempt = 0; attempt < attempts; attempt += 1) {
          const angle = random() * TAU;
          const radius = minimumDistance * (1 + random());
          const x = origin.x + Math.cos(angle) * radius;
          const z = origin.z + Math.sin(angle) * radius;

          if (
            x <= -halfWidth ||
            x >= halfWidth ||
            z <= -halfDepth ||
            z >= halfDepth
          ) {
            continue;
          }

          const column = Math.floor((x + halfWidth) / cellSize);
          const row = Math.floor((z + halfDepth) / cellSize);
          let isClear = true;

          for (
            let nearbyRow = Math.max(0, row - 2);
            nearbyRow <= Math.min(rows - 1, row + 2) && isClear;
            nearbyRow += 1
          ) {
            for (
              let nearbyColumn = Math.max(0, column - 2);
              nearbyColumn <= Math.min(columns - 1, column + 2);
              nearbyColumn += 1
            ) {
              const pointIndex = grid[nearbyRow * columns + nearbyColumn];
              if (pointIndex < 0) continue;

              const nearbyPoint = points[pointIndex];
              const deltaX = nearbyPoint.x - x;
              const deltaZ = nearbyPoint.z - z;
              if (deltaX * deltaX + deltaZ * deltaZ < minimumDistanceSquared) {
                isClear = false;
                break;
              }
            }
          }

          if (isClear) {
            insertPoint(x, z);
            accepted = true;
            break;
          }
        }

        if (!accepted) {
          active[activeSlot] = active[active.length - 1];
          active.pop();
        }
      }

      return points;
    };

    const makeTriangle = (pointA, pointB, pointC, points) => {
      const a = points[pointA];
      const b = points[pointB];
      const c = points[pointC];
      const divisor = 2 * (
        a.x * (b.z - c.z) +
        b.x * (c.z - a.z) +
        c.x * (a.z - b.z)
      );

      if (Math.abs(divisor) < 1e-9) return null;

      const aLength = a.x * a.x + a.z * a.z;
      const bLength = b.x * b.x + b.z * b.z;
      const cLength = c.x * c.x + c.z * c.z;
      const centerX = (
        aLength * (b.z - c.z) +
        bLength * (c.z - a.z) +
        cLength * (a.z - b.z)
      ) / divisor;
      const centerZ = (
        aLength * (c.x - b.x) +
        bLength * (a.x - c.x) +
        cLength * (b.x - a.x)
      ) / divisor;
      const deltaX = centerX - a.x;
      const deltaZ = centerZ - a.z;

      return {
        a: pointA,
        b: pointB,
        c: pointC,
        centerX,
        centerZ,
        radiusSquared: deltaX * deltaX + deltaZ * deltaZ
      };
    };

    const delaunayTriangulate = (sourcePoints) => {
      const points = sourcePoints.map((point) => ({ ...point }));
      const superStart = points.length;
      const span = Math.max(SHEET_HALF_WIDTH, SHEET_HALF_DEPTH) * 12;
      points.push(
        { x: -span, z: -span },
        { x: 0, z: span },
        { x: span, z: -span }
      );

      const superTriangle = makeTriangle(
        superStart,
        superStart + 1,
        superStart + 2,
        points
      );
      let triangles = [superTriangle];

      for (let pointIndex = 0; pointIndex < superStart; pointIndex += 1) {
        const point = points[pointIndex];
        const badTriangleIndexes = [];

        for (let triangleIndex = 0; triangleIndex < triangles.length; triangleIndex += 1) {
          const triangle = triangles[triangleIndex];
          const deltaX = point.x - triangle.centerX;
          const deltaZ = point.z - triangle.centerZ;
          if (
            deltaX * deltaX + deltaZ * deltaZ <=
            triangle.radiusSquared + 1e-8
          ) {
            badTriangleIndexes.push(triangleIndex);
          }
        }

        const boundaryEdges = new Map();
        for (const triangleIndex of badTriangleIndexes) {
          const triangle = triangles[triangleIndex];
          const edges = [
            [triangle.a, triangle.b],
            [triangle.b, triangle.c],
            [triangle.c, triangle.a]
          ];

          for (const [start, end] of edges) {
            const low = Math.min(start, end);
            const high = Math.max(start, end);
            const key = `${low}:${high}`;
            const edge = boundaryEdges.get(key);
            if (edge) {
              edge.count += 1;
            } else {
              boundaryEdges.set(key, { start, end, count: 1 });
            }
          }
        }

        const badSet = new Set(badTriangleIndexes);
        triangles = triangles.filter((_, index) => !badSet.has(index));

        for (const edge of boundaryEdges.values()) {
          if (edge.count !== 1) continue;
          const triangle = makeTriangle(edge.start, edge.end, pointIndex, points);
          if (triangle) triangles.push(triangle);
        }
      }

      return triangles.filter(
        (triangle) =>
          triangle.a < superStart &&
          triangle.b < superStart &&
          triangle.c < superStart
      );
    };

    const clipSegmentToSheet = (startX, startZ, endX, endZ) => {
      const deltaX = endX - startX;
      const deltaZ = endZ - startZ;
      const p = [-deltaX, deltaX, -deltaZ, deltaZ];
      const q = [
        startX + SHEET_HALF_WIDTH,
        SHEET_HALF_WIDTH - startX,
        startZ + SHEET_HALF_DEPTH,
        SHEET_HALF_DEPTH - startZ
      ];
      let minimum = 0;
      let maximum = 1;

      for (let index = 0; index < 4; index += 1) {
        if (Math.abs(p[index]) < 1e-10) {
          if (q[index] < 0) return null;
          continue;
        }

        const ratio = q[index] / p[index];
        if (p[index] < 0) {
          minimum = Math.max(minimum, ratio);
        } else {
          maximum = Math.min(maximum, ratio);
        }
        if (minimum > maximum) return null;
      }

      return {
        startX: startX + deltaX * minimum,
        startZ: startZ + deltaZ * minimum,
        endX: startX + deltaX * maximum,
        endZ: startZ + deltaZ * maximum
      };
    };

    const buildVoronoiSegments = () => {
      const sites = poissonSample(
        SHEET_HALF_WIDTH * 2,
        SHEET_HALF_DEPTH * 2,
        0.53
      );
      const ghostMargin = 1.25;
      const ghostSpacing = 0.72;

      for (
        let x = -SHEET_HALF_WIDTH - ghostMargin;
        x <= SHEET_HALF_WIDTH + ghostMargin;
        x += ghostSpacing
      ) {
        sites.push(
          { x, z: -SHEET_HALF_DEPTH - ghostMargin },
          { x, z: SHEET_HALF_DEPTH + ghostMargin }
        );
      }

      for (
        let z = -SHEET_HALF_DEPTH - ghostMargin + ghostSpacing;
        z < SHEET_HALF_DEPTH + ghostMargin;
        z += ghostSpacing
      ) {
        sites.push(
          { x: -SHEET_HALF_WIDTH - ghostMargin, z },
          { x: SHEET_HALF_WIDTH + ghostMargin, z }
        );
      }

      const triangles = delaunayTriangulate(sites);
      const edgeCenters = new Map();

      for (const triangle of triangles) {
        const edges = [
          [triangle.a, triangle.b],
          [triangle.b, triangle.c],
          [triangle.c, triangle.a]
        ];

        for (const [start, end] of edges) {
          const key = `${Math.min(start, end)}:${Math.max(start, end)}`;
          const centers = edgeCenters.get(key) || [];
          centers.push({ x: triangle.centerX, z: triangle.centerZ });
          edgeCenters.set(key, centers);
        }
      }

      const segments = [];
      for (const centers of edgeCenters.values()) {
        if (centers.length !== 2) continue;
        const clipped = clipSegmentToSheet(
          centers[0].x,
          centers[0].z,
          centers[1].x,
          centers[1].z
        );
        if (!clipped) continue;

        const deltaX = clipped.endX - clipped.startX;
        const deltaZ = clipped.endZ - clipped.startZ;
        const length = Math.hypot(deltaX, deltaZ);
        if (length < 0.045 || length > 3.4) continue;

        segments.push({ ...clipped, length });
      }

      return segments;
    };

    try {
      const THREE = await import(CDN_URL);
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.16;
      stage.appendChild(renderer.domElement);

      renderer.domElement.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        showError("3D 화면 연결이 잠시 중단되었습니다. 페이지를 새로고침해 주세요.");
      });

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050812, 0.011);

      const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 140);
      const cameraTarget = new THREE.Vector3(0, -0.1, 0);
      let cameraDistance = 28;
      let renderedCameraDistance = cameraDistance;
      let fitDistance = cameraDistance;
      let minimumCameraDistance = 15;
      let maximumCameraDistance = 54;

      const exhibit = new THREE.Group();
      exhibit.rotation.order = "YXZ";
      exhibit.rotation.set(0.04, -0.11, -0.025);
      scene.add(exhibit);

      const mapToSheet = (parameterX, parameterZ, target = new THREE.Vector3()) => {
        const normalizedX = parameterX / SHEET_HALF_WIDTH;
        const normalizedZ = parameterZ / SHEET_HALF_DEPTH;
        let x = parameterX;
        let z = parameterZ;
        let y =
          Math.sin(parameterX * 0.47 + parameterZ * 0.18) * 0.19 +
          Math.sin(parameterZ * 0.86 - parameterX * 0.13) * 0.13 +
          Math.sin(parameterX * 0.18 - parameterZ * 0.61) * 0.09 -
          (1 - normalizedX * normalizedX) *
          (1 - normalizedZ * normalizedZ) *
          0.28;

        const twists = [
          { x: -2.65, z: 0.65, radius: 2.4, turn: 0.3, lift: 0.28 },
          { x: 3.35, z: -0.55, radius: 2.15, turn: -0.26, lift: -0.23 }
        ];

        for (const twist of twists) {
          const deltaX = parameterX - twist.x;
          const deltaZ = parameterZ - twist.z;
          const distanceSquared = deltaX * deltaX + deltaZ * deltaZ;
          const influence = Math.exp(
            -distanceSquared / (twist.radius * twist.radius)
          );
          const angle = twist.turn * influence;
          const cosine = Math.cos(angle);
          const sine = Math.sin(angle);
          const rotatedX = deltaX * cosine - deltaZ * sine;
          const rotatedZ = deltaX * sine + deltaZ * cosine;
          const polarAngle = Math.atan2(deltaZ, deltaX);
          const radius = Math.sqrt(distanceSquared);

          x += (rotatedX - deltaX) * 0.72;
          z += (rotatedZ - deltaZ) * 0.72;
          y +=
            Math.sin(polarAngle * 2.0 + radius * 2.1) *
            influence *
            twist.lift;
        }

        return target.set(x, y, z);
      };

      const starCount = 950;
      const starPositions = new Float32Array(starCount * 3);
      const starColors = new Float32Array(starCount * 3);
      const warmStar = new THREE.Color(0xf3e9d9);
      const coolStar = new THREE.Color(0xa7b9e4);
      const starColor = new THREE.Color();

      for (let index = 0; index < starCount; index += 1) {
        const radius = 36 + random() * 54;
        const theta = random() * TAU;
        const phi = Math.acos(2 * random() - 1);
        const offset = index * 3;

        starPositions[offset] = radius * Math.sin(phi) * Math.cos(theta);
        starPositions[offset + 1] = radius * Math.cos(phi);
        starPositions[offset + 2] = radius * Math.sin(phi) * Math.sin(theta);

        starColor.copy(warmStar).lerp(coolStar, random() * 0.72);
        starColors[offset] = starColor.r;
        starColors[offset + 1] = starColor.g;
        starColors[offset + 2] = starColor.b;
      }

      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
      starGeometry.setAttribute("color", new THREE.BufferAttribute(starColors, 3));

      const starMaterial = new THREE.PointsMaterial({
        size: 0.045,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.34,
        depthWrite: false,
        vertexColors: true,
        blending: THREE.AdditiveBlending
      });

      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      const voronoiSegments = buildVoronoiSegments();
      if (voronoiSegments.length < 100) {
        throw new Error("와이어 네트워크 생성에 실패했습니다.");
      }

      const wirePositions = [];
      const mappedStart = new THREE.Vector3();
      const mappedEnd = new THREE.Vector3();

      for (const segment of voronoiSegments) {
        const subdivisions = Math.max(1, Math.ceil(segment.length / 0.24));

        for (let step = 0; step < subdivisions; step += 1) {
          const startMix = step / subdivisions;
          const endMix = (step + 1) / subdivisions;
          mapToSheet(
            THREE.MathUtils.lerp(segment.startX, segment.endX, startMix),
            THREE.MathUtils.lerp(segment.startZ, segment.endZ, startMix),
            mappedStart
          );
          mapToSheet(
            THREE.MathUtils.lerp(segment.startX, segment.endX, endMix),
            THREE.MathUtils.lerp(segment.startZ, segment.endZ, endMix),
            mappedEnd
          );
          wirePositions.push(
            mappedStart.x, mappedStart.y, mappedStart.z,
            mappedEnd.x, mappedEnd.y, mappedEnd.z
          );
        }
      }

      const wireGeometry = new THREE.BufferGeometry();
      wireGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(wirePositions, 3)
      );
      wireGeometry.computeBoundingSphere();

      const wireMaterial = new THREE.LineBasicMaterial({
        color: 0x5e6572,
        transparent: true,
        opacity: 0.32,
        depthWrite: false
      });

      const wireNet = new THREE.LineSegments(wireGeometry, wireMaterial);
      wireNet.frustumCulled = false;
      wireNet.renderOrder = 1;
      exhibit.add(wireNet);

      const segmentCumulativeLengths = [];
      let totalSegmentLength = 0;
      for (const segment of voronoiSegments) {
        totalSegmentLength += segment.length;
        segmentCumulativeLengths.push(totalSegmentLength);
      }

      const pickWeightedSegment = () => {
        const targetLength = random() * totalSegmentLength;
        let low = 0;
        let high = segmentCumulativeLengths.length - 1;

        while (low < high) {
          const middle = (low + high) >> 1;
          if (segmentCumulativeLengths[middle] < targetLength) {
            low = middle + 1;
          } else {
            high = middle;
          }
        }

        return voronoiSegments[low];
      };

      const snapToWire = (targetX, targetZ) => {
        let closestX = targetX;
        let closestZ = targetZ;
        let closestDistanceSquared = Infinity;

        for (const segment of voronoiSegments) {
          const deltaX = segment.endX - segment.startX;
          const deltaZ = segment.endZ - segment.startZ;
          const lengthSquared = deltaX * deltaX + deltaZ * deltaZ;
          const mix = THREE.MathUtils.clamp(
            (
              (targetX - segment.startX) * deltaX +
              (targetZ - segment.startZ) * deltaZ
            ) / lengthSquared,
            0,
            1
          );
          const candidateX = segment.startX + deltaX * mix;
          const candidateZ = segment.startZ + deltaZ * mix;
          const distanceX = candidateX - targetX;
          const distanceZ = candidateZ - targetZ;
          const distanceSquared =
            distanceX * distanceX + distanceZ * distanceZ;

          if (distanceSquared < closestDistanceSquared) {
            closestDistanceSquared = distanceSquared;
            closestX = candidateX;
            closestZ = candidateZ;
          }
        }

        return { x: closestX, z: closestZ };
      };

      const clusterDefinitions = [
        { x: -5.35, z: -0.7, count: 900, radius: 1.2, angle: -0.32, phase: 0.4 },
        { x: -1.75, z: 1.15, count: 940, radius: 1.12, angle: 0.25, phase: 2.2 },
        { x: 2.15, z: -0.9, count: 930, radius: 1.22, angle: -0.18, phase: 4.1 },
        { x: 5.25, z: 0.8, count: 880, radius: 1.04, angle: 0.38, phase: 1.25 }
      ];

      const ledGeometry = new THREE.SphereGeometry(0.034, 5, 4);
      const phases = new Float32Array(LED_COUNT);
      const brightnesses = new Float32Array(LED_COUNT);
      const rates = new Float32Array(LED_COUNT);
      ledGeometry.setAttribute(
        "aPhase",
        new THREE.InstancedBufferAttribute(phases, 1)
      );
      ledGeometry.setAttribute(
        "aBrightness",
        new THREE.InstancedBufferAttribute(brightnesses, 1)
      );
      ledGeometry.setAttribute(
        "aRate",
        new THREE.InstancedBufferAttribute(rates, 1)
      );

      const ledMaterial = new THREE.RawShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uMotionScale: { value: prefersReducedMotion.matches ? 0 : 1 }
        },
        vertexShader: `
          precision highp float;

          uniform mat4 modelViewMatrix;
          uniform mat4 projectionMatrix;

          attribute vec3 position;
          attribute vec3 normal;
          attribute mat4 instanceMatrix;
          attribute vec3 instanceColor;
          attribute float aPhase;
          attribute float aBrightness;
          attribute float aRate;

          varying vec3 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          varying float vPhase;
          varying float vBrightness;
          varying float vRate;

          void main() {
            mat4 instanceModelView = modelViewMatrix * instanceMatrix;
            vec4 viewPosition = instanceModelView * vec4(position, 1.0);

            vColor = instanceColor;
            vNormal = normalize(mat3(instanceModelView) * normal);
            vViewPosition = viewPosition.xyz;
            vPhase = aPhase;
            vBrightness = aBrightness;
            vRate = aRate;

            gl_Position = projectionMatrix * viewPosition;
          }
        `,
        fragmentShader: `
          precision highp float;

          uniform float uTime;
          uniform float uMotionScale;

          varying vec3 vColor;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          varying float vPhase;
          varying float vBrightness;
          varying float vRate;

          const float TAU = 6.28318530718;

          void main() {
            float movingTime = uTime * uMotionScale;
            float wave = 0.5 + 0.5 * sin(
              vPhase * TAU + movingTime * vRate
            );
            float sparkle = pow(
              0.5 + 0.5 * sin(vPhase * 31.0 - movingTime * (vRate * 1.7)),
              18.0
            );
            float facing = 0.72 + 0.28 * abs(
              dot(normalize(vNormal), normalize(-vViewPosition))
            );
            float intensity =
              vBrightness *
              (0.72 + wave * 0.26 + sparkle * 0.82) *
              facing;
            float alpha = clamp(
              (0.48 + wave * 0.34 + sparkle * 0.5) *
              (0.7 + vBrightness * 0.25),
              0.0,
              1.0
            );

            gl_FragColor = vec4(vColor * intensity, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const leds = new THREE.InstancedMesh(ledGeometry, ledMaterial, LED_COUNT);
      leds.instanceMatrix.setUsage(THREE.StaticDrawUsage);
      leds.frustumCulled = false;
      leds.renderOrder = 2;

      const dummy = new THREE.Object3D();
      const ledPosition = new THREE.Vector3();
      const ledColor = new THREE.Color();
      let ledIndex = 0;

      const placeLed = (parameterX, parameterZ, brightness) => {
        mapToSheet(parameterX, parameterZ, ledPosition);
        ledPosition.y += 0.026 + random() * 0.024;

        const sizeVariation = 0.72 + random() * 0.42 + brightness * 0.18;
        dummy.position.copy(ledPosition);
        dummy.scale.setScalar(sizeVariation);
        dummy.updateMatrix();
        leds.setMatrixAt(ledIndex, dummy.matrix);

        if (random() < 0.22) {
          const warmth = random();
          ledColor.setRGB(
            1,
            0.965 + warmth * 0.035,
            0.905 + warmth * 0.08
          );
        } else {
          const coolness = random() * 0.035;
          ledColor.setRGB(0.965 + coolness, 0.98 + coolness * 0.5, 1);
        }
        leds.setColorAt(ledIndex, ledColor);

        phases[ledIndex] = random();
        brightnesses[ledIndex] = brightness;
        rates[ledIndex] = 0.72 + random() * 1.65;
        ledIndex += 1;
      };

      for (let index = 0; index < AMBIENT_LED_COUNT; index += 1) {
        const segment = pickWeightedSegment();
        const atJunction = random() < 0.24;
        const mix = atJunction
          ? (random() < 0.5 ? 0 : 1)
          : random();
        const x = THREE.MathUtils.lerp(segment.startX, segment.endX, mix);
        const z = THREE.MathUtils.lerp(segment.startZ, segment.endZ, mix);
        placeLed(x, z, 0.56 + random() * 0.3);
      }

      for (const cluster of clusterDefinitions) {
        const cosine = Math.cos(cluster.angle);
        const sine = Math.sin(cluster.angle);

        for (let index = 0; index < cluster.count; index += 1) {
          const arm = index % 3;
          const radialSeed = Math.sqrt(-2 * Math.log(Math.max(random(), 1e-7)));
          const radius = radialSeed * cluster.radius * 0.52;
          const cloudMix = random();
          const spiralAngle = cloudMix < 0.72
            ? cluster.phase +
              arm * (TAU / 3) +
              radius * 2.35 +
              gaussianRandom() * 0.22
            : cluster.phase + random() * TAU;
          const localX = Math.cos(spiralAngle) * radius * 1.18;
          const localZ = Math.sin(spiralAngle) * radius * 0.62;
          const targetX = THREE.MathUtils.clamp(
            cluster.x + localX * cosine - localZ * sine,
            -SHEET_HALF_WIDTH + 0.08,
            SHEET_HALF_WIDTH - 0.08
          );
          const targetZ = THREE.MathUtils.clamp(
            cluster.z + localX * sine + localZ * cosine,
            -SHEET_HALF_DEPTH + 0.08,
            SHEET_HALF_DEPTH - 0.08
          );
          const snapped = snapToWire(targetX, targetZ);
          const centerStrength = Math.exp(
            -(radius * radius) /
            (2 * cluster.radius * cluster.radius)
          );

          placeLed(
            snapped.x,
            snapped.z,
            0.72 + centerStrength * 0.55 + random() * 0.12
          );
        }
      }

      if (ledIndex !== LED_COUNT) {
        throw new Error(`LED 개수 불일치: ${ledIndex}`);
      }

      leds.instanceMatrix.needsUpdate = true;
      leds.instanceColor.needsUpdate = true;
      ledGeometry.getAttribute("aPhase").needsUpdate = true;
      ledGeometry.getAttribute("aBrightness").needsUpdate = true;
      ledGeometry.getAttribute("aRate").needsUpdate = true;
      exhibit.add(leds);

      let rotationVelocityX = 0;
      let rotationVelocityY = 0;
      let lastInteractionTime = performance.now();
      const activePointers = new Map();
      let pinchStartDistance = 0;
      let pinchStartCameraDistance = cameraDistance;

      const markInteraction = () => {
        lastInteractionTime = performance.now();
        viewer.classList.add("has-interacted");
      };

      const getPinchDistance = () => {
        const pointers = Array.from(activePointers.values());
        if (pointers.length < 2) return 0;
        return Math.hypot(
          pointers[0].x - pointers[1].x,
          pointers[0].y - pointers[1].y
        );
      };

      stage.addEventListener("pointerdown", (event) => {
        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });
        stage.setPointerCapture(event.pointerId);
        stage.classList.add("is-dragging");
        markInteraction();

        if (activePointers.size === 2) {
          pinchStartDistance = getPinchDistance();
          pinchStartCameraDistance = cameraDistance;
        }
      });

      stage.addEventListener("pointermove", (event) => {
        const previous = activePointers.get(event.pointerId);
        if (!previous) return;

        const current = { x: event.clientX, y: event.clientY };
        activePointers.set(event.pointerId, current);
        markInteraction();

        if (activePointers.size === 1) {
          const deltaX = current.x - previous.x;
          const deltaY = current.y - previous.y;
          const dragScale = 0.0055;

          exhibit.rotation.y += deltaX * dragScale;
          exhibit.rotation.x = THREE.MathUtils.clamp(
            exhibit.rotation.x + deltaY * dragScale,
            -1.15,
            1.15
          );
          rotationVelocityY = deltaX * dragScale;
          rotationVelocityX = deltaY * dragScale;
        } else if (activePointers.size === 2) {
          const pinchDistance = getPinchDistance();
          if (pinchStartDistance > 0 && pinchDistance > 0) {
            cameraDistance = THREE.MathUtils.clamp(
              pinchStartCameraDistance * (pinchStartDistance / pinchDistance),
              minimumCameraDistance,
              maximumCameraDistance
            );
          }
        }
      });

      const releasePointer = (event) => {
        activePointers.delete(event.pointerId);

        if (stage.hasPointerCapture(event.pointerId)) {
          stage.releasePointerCapture(event.pointerId);
        }

        if (activePointers.size < 2) {
          pinchStartDistance = 0;
        }

        if (activePointers.size === 0) {
          stage.classList.remove("is-dragging");
        }
      };

      stage.addEventListener("pointerup", releasePointer);
      stage.addEventListener("pointercancel", releasePointer);

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        cameraDistance = THREE.MathUtils.clamp(
          cameraDistance + event.deltaY * 0.018,
          minimumCameraDistance,
          maximumCameraDistance
        );
        markInteraction();
      }, { passive: false });

      let hasSized = false;
      const resize = () => {
        const width = Math.max(1, stage.clientWidth);
        const height = Math.max(1, stage.clientHeight);
        const previousFitDistance = fitDistance;

        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO));
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        const halfFieldOfView = THREE.MathUtils.degToRad(camera.fov * 0.5);
        const verticalFit =
          (SHEET_HALF_DEPTH + 1.0) / Math.tan(halfFieldOfView);
        const horizontalFit =
          (SHEET_HALF_WIDTH + 0.65) /
          (Math.tan(halfFieldOfView) * camera.aspect);
        fitDistance = THREE.MathUtils.clamp(
          Math.max(verticalFit, horizontalFit) * 1.08,
          17,
          62
        );
        minimumCameraDistance = fitDistance * 0.6;
        maximumCameraDistance = Math.min(112, fitDistance * 1.85);

        if (!hasSized) {
          cameraDistance = fitDistance * 0.68;   // 첫인상 보정: 기본 프레이밍이 멀어 그물이 작게 보임 → 시작 줌 당김 (핀치로 자유 조절)
          renderedCameraDistance = cameraDistance;
          hasSized = true;
        } else {
          const relativeZoom = cameraDistance / previousFitDistance;
          cameraDistance = THREE.MathUtils.clamp(
            fitDistance * relativeZoom,
            minimumCameraDistance,
            maximumCameraDistance
          );
        }
      };

      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(stage);
      resize();

      const syncMotionPreference = (event) => {
        ledMaterial.uniforms.uMotionScale.value = event.matches ? 0 : 1;
      };
      if (typeof prefersReducedMotion.addEventListener === "function") {
        prefersReducedMotion.addEventListener("change", syncMotionPreference);
      } else {
        prefersReducedMotion.addListener(syncMotionPreference);
      }

      let previousFrameTime = performance.now();
      let firstFrame = true;

      const animate = (now) => {
        const deltaSeconds = Math.min((now - previousFrameTime) / 1000, 0.05);
        previousFrameTime = now;

        const frameDamping = Math.pow(0.9, deltaSeconds * 60);
        if (activePointers.size === 0) {
          exhibit.rotation.x = THREE.MathUtils.clamp(
            exhibit.rotation.x + rotationVelocityX,
            -1.15,
            1.15
          );
          exhibit.rotation.y += rotationVelocityY;
          rotationVelocityX *= frameDamping;
          rotationVelocityY *= frameDamping;

          const idleFor = now - lastInteractionTime;
          if (idleFor > 2200 && !prefersReducedMotion.matches) {
            exhibit.rotation.y += deltaSeconds * 0.032;
            exhibit.rotation.z =
              -0.025 + Math.sin(now * 0.00011) * 0.018;
          }
        }

        renderedCameraDistance +=
          (cameraDistance - renderedCameraDistance) *
          Math.min(1, deltaSeconds * 8);
        camera.position.set(
          0,
          -renderedCameraDistance * 0.52,
          renderedCameraDistance * 0.854
        );
        camera.lookAt(cameraTarget);

        stars.rotation.y += deltaSeconds * 0.0025;
        stars.rotation.x = Math.sin(now * 0.000018) * 0.018;
        ledMaterial.uniforms.uTime.value = now * 0.001;

        renderer.render(scene, camera);

        if (firstFrame) {
          firstFrame = false;
          window.requestAnimationFrame(() => {
            loading.classList.add("is-hidden");
          });
        }

        window.requestAnimationFrame(animate);
      };

      window.requestAnimationFrame(animate);
    } catch (error) {
      console.error(error);
      showError("3D 전시를 불러오지 못했습니다. 네트워크 연결 후 다시 시도해 주세요.");
    }
  </script>
</body>
</html>
